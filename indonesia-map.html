<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indonesië — Reiskaart</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tripmap.css">
<style>
/* De kaart vult het scherm; de navigatiebalk zweeft eroverheen. */
.app-header {
  position: fixed;
  top: 14px;
  left: 14px;
  right: 14px;
  z-index: 900;
  margin-bottom: 0;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

/* Ruimte maken voor de zwevende header binnen het kaartcomponent. */
#tripmap .tm-topbar { top: 104px; }
#tripmap .tm-side { top: 168px; }

@media (max-width: 780px) {
  .app-header { top: 8px; left: 8px; right: 8px; }
  #tripmap .tm-topbar { top: 152px; }
  #tripmap .tm-side { top: auto; }
}
</style>
</head>
<body>

<!-- KAARTCOMPONENT (tripmap.js) — vult het volledige scherm -->
<div id="tripmap"></div>

<!-- NAVIGATIE -->
<header class="app-header">
  <div class="app-brand">
    <h1>🧭 Reiskaart</h1>
    <div class="sub">Indonesië · 29 aug – 29 sep 2026</div>
  </div>
  <nav class="app-nav">
    <a class="app-nav-link" href="indonesia-tracker.html">🏠 Home</a>
    <a class="app-nav-link" href="indonesia-timeline.html">📅 Reisschema</a>
    <a class="app-nav-link active" href="indonesia-map.html">🗺️ Reiskaart</a>
    <a class="app-nav-link" href="indonesia-live.html">📍 Live Tracker</a>
    <a class="app-nav-link" href="indonesia-health.html">🏥 Gezondheid</a>
    <a class="app-nav-link" href="indonesia-transport.html">🚇 Transport</a>
  </nav>
</header>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data.js"></script>
<script src="tripmap.js"></script>
<script>
/* De volledige kaartervaring: alle reizigers zichtbaar, dagschema afgeleid
   uit TRIP + TRANSPORT_LEGS, en de gekozen reiziger in de zijbalk uitgelicht.
   De keuze blijft gedeeld met de andere pagina's via "selected_person". */
const kaart = TripMap.create({
  el: "#tripmap",
  mode: "full",
  person: getSelectedPerson(),
  people: PERSON_ORDER.slice(),
  day: "today",
  onPersonChange(key) {
    ls_set("selected_person", key);
  },
});

/* Diep linken vanaf andere pagina's: #t12 opent die etappe,
   #dag=14 springt naar een dagnummer. */
function pasHashToe() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!h) return;
  const dagMatch = h.match(/^dag=(\d+)$/);
  if (dagMatch) { kaart.setDay(parseInt(dagMatch[1], 10) - 1, true); return; }
  const trip = TRIP.find(t => t.id === h);
  if (trip) {
    kaart.setDay(TripMap.dayOfDate(trip.start), true);
    kaart.highlightTrips([trip.id]);
  }
}
pasHashToe();
window.addEventListener("hashchange", pasHashToe);

/* Pijltjestoetsen om door de dagen te bladeren. */
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowRight") kaart.setDay(kaart.getDay() + 1, true);
  else if (e.key === "ArrowLeft") kaart.setDay(kaart.getDay() - 1, true);
  else if (e.key === " ") { e.preventDefault(); kaart.togglePlay(); }
});
</script>
</body>
</html>
