<div class="wrap">

  <!-- TOP BAR & NAVIGATION -->
  <header class="app-header">
    <div class="app-brand">
      <h1>🧭 Reis naar Indonesië</h1>
      <div class="sub">28 aug – 29 sep 2026</div>
    </div>
    <nav class="app-nav">
      <a class="app-nav-link active" href="indonesia-tracker.html">🏠 Home</a>
      <a class="app-nav-link" href="indonesia-timeline.html">📅 Reisschema</a>

      <a class="app-nav-link" href="indonesia-health.html">🏥 Gezondheid</a>
      <a class="app-nav-link" href="indonesia-transport.html">🚇 Transport</a>
    </nav>
  </header>

  <!-- PERSON SELECTOR -->
  <div class="person-selector-container" id="personSelector"></div>

  <!-- QUICK STATS -->
  <div class="stat-row" id="statRow"></div>

  <!-- TOP ROW: REISGEZELSCHAP & KOSTEN (EQUAL HEIGHT) -->
  <div class="panel-grid-top">
    <!-- REISGEZELSCHAP -->
    <section class="panel group-panel-height">
      <h2>👥 Reisgezelschap</h2>
      <div id="groupPanel"></div>
    </section>

    <!-- KOSTEN DASHBOARD -->
    <section class="panel group-panel-height">
      <h2>💶 Kosten <span id="tbdPill"></span></h2>
      <div class="cost-flex">
        <div class="cost-totals" id="costTotals"></div>
        <div class="chart-container">
          <canvas id="costChart"></canvas>
        </div>
      </div>
    </section>
  </div>

  <!-- BOTTOM ROW: COMBINED ROUTE MAP & STEPPER -->
  <section class="panel combined-route-panel">
    <h2>🗺️ Route &amp; Verloop <span id="routeStepperCount" class="tbd-pill" style="margin-left:auto; background:var(--teal-soft); color:var(--teal); border-color:rgba(0,180,216,0.2)"></span></h2>
    <div class="combined-route-grid">
      <div class="route-left">
        <div class="route-stepper" id="routeStepper"></div>
      </div>
      <div class="route-right">
        <div class="map-wrap">
          <svg id="routemap" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="map-legend" id="mapLegend"></div>
        <div id="lockedPhotosPanel" class="locked-photos-panel" style="display:none"></div>
      </div>
    </div>
  </section>

  <!-- DESTINATIONS GALLERY -->
  <section class="panel destinations-panel">
    <h2>📸 Bestemmingen</h2>
    <div class="destinations-row" id="destinationsGallery"></div>
  </section>

  <footer class="note">Kosten zijn per persoon. Wijzigingen worden lokaal in de browser onthouden en gesynchroniseerd met het reisschema.</footer>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">

/* ---------------- HELPERS ---------------- */
const MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function fmtShort(d){ const dt=new Date(d+"T00:00:00"); return dt.getDate()+" "+MONTHS[dt.getMonth()]; }
function fmtRange(s,e){ return s===e ? fmtShort(s) : (s.slice(0,7)===e.slice(0,7) ? new Date(s+"T00:00:00").getDate()+"–"+fmtShort(e) : fmtShort(s)+" – "+fmtShort(e)); }

function today(){ return new Date(new Date().toDateString()); }
function dateOf(s){ return new Date(s+"T00:00:00"); }

function statusOf(item){
  const t = today();
  const s = dateOf(item.start), e = dateOf(item.end);
  if (e < t) return "voltooid";
  if (s <= t && t <= e) return "bezig";
  const days = (s - t) / 86400000;
  if (days <= 10) return "binnenkort";
  return "gepland";
}

function ls_get(key, fallback){ try { const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); } catch(e){ return fallback; } }
function ls_set(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

function costValue(id){
  const stored = ls_get("cost_"+id, undefined);
  if (stored !== undefined && stored !== "") return Number(stored);
  const def = COSTS[id].amount;
  return def === null ? null : def;
}
function isBooked(id){ return ls_get("booked_"+id, false); }

let chartRef = null;
let lockedTripIds = null;
let lockedFaseKey = null;

function getCostsForPerson(personKey) {
  const tripIds = PERSON_TRIPS[personKey] || [];
  const costIds = new Set();
  for (const item of TRIP) {
    if (tripIds.includes(item.id)) {
      for (const cid of item.costs) {
        costIds.add(cid);
      }
    }
  }
  return costIds;
}

function recalcAll(){
  const personKey = ls_get("selected_person", "matthew");
  const allowedCosts = getCostsForPerson(personKey);

  let total = 0, confirmed = 0, tbdCount = 0;
  const byCat = { vlucht:0, accommodatie:0, transport:0, activiteit:0 };
  for (const id in COSTS) {
    if (!allowedCosts.has(id)) continue;
    const v = costValue(id);
    const cat = COSTS[id].cat;
    if (v === null) { tbdCount++; continue; }
    total += v;
    byCat[cat] += v;
    if (isBooked(id)) confirmed += v;
  }
  
  document.getElementById("costTotals").innerHTML = `
    <div class="row"><span class="l">✈️ Vluchten</span><span class="v">€ ${(byCat.vlucht).toFixed(2)}</span></div>
    <div class="row"><span class="l">🏨 Accommodatie</span><span class="v">€ ${(byCat.accommodatie).toFixed(2)}</span></div>
    <div class="row"><span class="l">🚌 Transport (taxi/trein)</span><span class="v">€ ${(byCat.transport).toFixed(2)}</span></div>
    <div class="row"><span class="l">🎟️ Activiteiten</span><span class="v">€ ${(byCat.activiteit).toFixed(2)}</span></div>
    <div class="row"><span class="l">🔒 Geboekt &amp; Bevestigd</span><span class="v" style="color:var(--teal)">€ ${confirmed.toFixed(2)}</span></div>
    <div class="row total"><span class="l">Geschat Totaal (pp)</span><span class="v">€ ${total.toFixed(2)}</span></div>
  `;
  document.getElementById("tbdPill").innerHTML = tbdCount ? `<span class="tbd-pill">${tbdCount} open TBDs</span>` : "";

  const ctx = document.getElementById("costChart");
  const labels = ["Vluchten", "Accommodatie", "Transport", "Activiteiten"];
  const data = [byCat.vlucht, byCat.accommodatie, byCat.transport, byCat.activiteit];
  const colors = ["#4cc9f0", "#ffb703", "#4ad66d", "#f72585"];
  if (chartRef) chartRef.destroy();
  chartRef = new Chart(ctx, {
    type: "doughnut",
    data: { 
      labels, 
      datasets: [{ 
        data, 
        backgroundColor: colors, 
        borderWidth: 2,
        borderColor: "#0d111c",
        hoverOffset: 4
      }] 
    },
    options: {
      responsive: true, 
      maintainAspectRatio: false,
      plugins: { 
        legend: { 
          position: "bottom", 
          labels: { 
            boxWidth: 10, 
            color: "#94a3b8",
            font: { family: "Outfit", size: 11, weight: "500" } 
          } 
        } 
      }
    }
  });

  // Trip stats calculations
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id));

  let countdownLabel, countdownVal;
  let doneDays = 0, totalDays = 0;
  let periodVal = "—";

  if (personTrips.length > 0) {
    const start = dateOf(personTrips[0].start), end = dateOf(personTrips[personTrips.length-1].end);
    const t = today();
    if (t < start) { 
      countdownVal = Math.ceil((start - t)/86400000); 
      countdownLabel = "dagen tot vertrek"; 
    } else if (t <= end) { 
      countdownVal = Math.ceil((end - t)/86400000); 
      countdownLabel = "dagen te gaan"; 
    } else { 
      countdownVal = "✓"; 
      countdownLabel = "reis afgelopen"; 
    }
    doneDays = personTrips.filter(i => statusOf(i)==="voltooid").length;
    totalDays = personTrips.length;

    const sStr = personTrips[0].start;
    const eStr = personTrips[personTrips.length - 1].end;
    const sYear = sStr.slice(0, 4);
    const eYear = eStr.slice(0, 4);
    if (sYear === eYear) {
      periodVal = `${fmtRange(sStr, eStr)} <small>${sYear}</small>`;
    } else {
      periodVal = `${fmtShort(sStr)} ${sYear} – ${fmtShort(eStr)} ${eYear}`;
    }
  } else {
    countdownVal = "—";
    countdownLabel = "geen actieve data";
  }
  
  document.getElementById("statRow").innerHTML = `
    <div>
      <div class="stat-card">
        <div class="label">📅 Aftelklok</div>
        <div class="value">${countdownVal} <small>${countdownLabel}</small></div>
      </div>
    </div>
    <div class="stat-cards-right">
      <div class="stat-card">
        <div class="label">🛫 Periode</div>
        <div class="value" style="font-size: 19px; padding-top: 4px;">${periodVal}</div>
      </div>
      <div class="stat-card">
        <div class="label">🧗 Etappes Voltooid</div>
        <div class="value">${doneDays} <small>/ ${totalDays}</small></div>
      </div>
      <div class="stat-card">
        <div class="label">💶 Totaal Overzicht</div>
        <div class="value">€${total.toFixed(0)} <small>per persoon</small></div>
      </div>
    </div>
  `;
}

/* ---------------- RENDER: map & ZOOM ---------------- */
let mapZoom = {
  currentX: 0,
  currentY: 0,
  currentW: 900,
  currentH: 400,
  targetX: 0,
  targetY: 0,
  targetW: 900,
  targetH: 400,
  animationFrameId: null
};

function setMapZoomTarget(x, y, w, h) {
  mapZoom.targetX = x;
  mapZoom.targetY = y;
  mapZoom.targetW = w;
  mapZoom.targetH = h;
  
  if (mapZoom.animationFrameId === null) {
    animateZoom();
  }
}

function animateZoom() {
  const dx = mapZoom.targetX - mapZoom.currentX;
  const dy = mapZoom.targetY - mapZoom.currentY;
  const dw = mapZoom.targetW - mapZoom.currentW;
  const dh = mapZoom.targetH - mapZoom.currentH;
  
  const ease = 0.12;
  
  mapZoom.currentX += dx * ease;
  mapZoom.currentY += dy * ease;
  mapZoom.currentW += dw * ease;
  mapZoom.currentH += dh * ease;
  
  const svg = document.getElementById("routemap");
  if (svg) {
    svg.setAttribute("viewBox", `${mapZoom.currentX} ${mapZoom.currentY} ${mapZoom.currentW} ${mapZoom.currentH}`);
  }
  
  if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1 && Math.abs(dw) < 0.1 && Math.abs(dh) < 0.1) {
    mapZoom.currentX = mapZoom.targetX;
    mapZoom.currentY = mapZoom.targetY;
    mapZoom.currentW = mapZoom.targetW;
    mapZoom.currentH = mapZoom.targetH;
    if (svg) {
      svg.setAttribute("viewBox", `${mapZoom.currentX} ${mapZoom.currentY} ${mapZoom.currentW} ${mapZoom.currentH}`);
    }
    mapZoom.animationFrameId = null;
  } else {
    mapZoom.animationFrameId = requestAnimationFrame(animateZoom);
  }
}

function renderMap(highlightTripIds = null){
  const svg = document.getElementById("routemap");
  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id));

  const seq = [];
  for (const item of personTrips) {
    for (const k of item.map) {
      seq.push({k, item});
    }
  }

  let hoveredPhase = null;
  const activeMapKeys = new Set();
  
  if (highlightTripIds && highlightTripIds.length > 0) {
    const firstTrip = TRIP.find(i => i.id === highlightTripIds[0]);
    if (firstTrip) {
      hoveredPhase = firstTrip.fase;
      
      const personPhases = [];
      const seenPhases = new Set();
      for (const item of personTrips) {
        if (!seenPhases.has(item.fase)) {
          seenPhases.add(item.fase);
          personPhases.push(item.fase);
        }
      }
      
      const idx = personPhases.indexOf(hoveredPhase);
      const relevantPhases = [];
      if (idx !== -1) {
        if (idx > 0) relevantPhases.push(personPhases[idx - 1]);
        relevantPhases.push(personPhases[idx]);
        if (idx < personPhases.length - 1) relevantPhases.push(personPhases[idx + 1]);
      }
      
      for (const item of personTrips) {
        if (relevantPhases.includes(item.fase)) {
          for (const mk of item.map) {
            activeMapKeys.add(mk);
          }
        }
      }
    }
  }

  let svgContent = "";
  if (seq.length > 0) {
    if (highlightTripIds && highlightTripIds.length > 0) {
      for (let i = 0; i < seq.length - 1; i++) {
        const p1 = PTS[seq[i].k];
        const p2 = PTS[seq[i+1].k];
        const isActiveSegment = activeMapKeys.has(seq[i].k) && activeMapKeys.has(seq[i+1].k);
        const opacity = isActiveSegment ? 0.6 : 0.05;
        svgContent += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="rgba(0, 180, 216, ${opacity})" stroke-width="2" stroke-dasharray="5 4" style="transition: stroke 0.3s, opacity 0.3s" />`;
      }

      for (const tid of highlightTripIds) {
        const hItem = personTrips.find(i => i.id === tid);
        if (hItem && hItem.map.length > 1) {
          let hPath = "M " + hItem.map.map(k => `${PTS[k].x} ${PTS[k].y}`).join(" L ");
          svgContent += `<path d="${hPath}" fill="none" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round" class="glowing-route" style="filter: drop-shadow(0 0 5px rgba(255, 77, 77, 0.7)); transition: all 0.3s;" />`;
        }
      }
    } else {
      let path = "M " + seq.map(s => `${PTS[s.k].x} ${PTS[s.k].y}`).join(" L ");
      svgContent += `<path d="${path}" fill="none" stroke="rgba(0, 180, 216, 0.4)" stroke-width="2" stroke-dasharray="5 4" />`;
    }
  }

  const seen = {};
  for (const s of seq) {
    if (seen[s.k]) continue;
    seen[s.k] = s.item;
  }
  const curItem = personTrips.find(i => statusOf(i) === "bezig");

  for (const k in PTS) {
    const p = PTS[k];
    const isVisited = !!seen[k];
    const item = seen[k];
    const f = isVisited ? FASES[item.fase] : { color: "#475569" };
    const isCurrent = isVisited && curItem && curItem.map.includes(k);
    
    const isHoveredNode = highlightTripIds && seen[k] && highlightTripIds.includes(seen[k].id);
    
    let opacity = isVisited ? "1" : "0.25";
    let pointerEvents = isVisited ? "auto" : "none";
    
    if (highlightTripIds && highlightTripIds.length > 0) {
      if (activeMapKeys.has(k)) {
        opacity = "1";
      } else {
        opacity = "0.05";
        pointerEvents = "none";
      }
    }

    svgContent += `
      <g class="map-pt" style="opacity:${opacity}; pointer-events:${pointerEvents}; transition: opacity 0.3s;" ${isVisited ? `onclick="window.location.href='indonesia-timeline.html#${item.id}'"` : ""}>
        <circle class="halo" cx="${p.x}" cy="${p.y}" r="14" fill="${isHoveredNode ? '#ff4d4d' : f.color}" style="${isHoveredNode ? 'opacity: 0.6' : ''}"/>
        ${isCurrent ? `<circle cx="${p.x}" cy="${p.y}" r="10" fill="none" stroke="#ff4d4d" stroke-width="2"><animate attributeName="r" values="8;13;8" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>` : ""}
        <circle cx="${p.x}" cy="${p.y}" r="5.5" fill="${isHoveredNode ? '#ff4d4d' : f.color}" stroke="#07090e" stroke-width="2"/>
        <text x="${p.x + (p.dx !== undefined ? p.dx : 9)}" y="${p.y + (p.dy !== undefined ? p.dy : 3)}" text-anchor="${p.anchor || 'start'}" style="${isHoveredNode ? 'fill: #ff4d4d; font-weight: 700;' : ''}; transition: fill 0.3s;">${p.label}</text>
      </g>`;
  }
  svg.innerHTML = svgContent;

  document.getElementById("mapLegend").innerHTML = Object.values(FASES).map(f =>
    `<span><i style="background:${f.color}"></i>${f.label}</span>`
  ).join("") + `<span><i style="background:#ff4d4d"></i>vandaag</span>`;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  if (highlightTripIds && highlightTripIds.length > 0 && activeMapKeys.size > 0) {
    for (const key of activeMapKeys) {
      const pt = PTS[key];
      if (pt.x < minX) minX = pt.x;
      if (pt.x > maxX) maxX = pt.x;
      if (pt.y < minY) minY = pt.y;
      if (pt.y > maxY) maxY = pt.y;
    }
  }

  let targetX, targetY, targetW, targetH;
  if (minX === Infinity) {
    targetX = 0;
    targetY = 0;
    targetW = 900;
    targetH = 400;
  } else {
    const padX = 80;
    const padY = 50;
    targetX = minX - padX;
    targetY = minY - padY;
    targetW = (maxX - minX) + padX * 2;
    targetH = (maxY - minY) + padY * 2;

    const aspect = 900 / 400;
    if (targetW / targetH > aspect) {
      const newH = targetW / aspect;
      targetY -= (newH - targetH) / 2;
      targetH = newH;
    } else {
      const newW = targetH * aspect;
      targetX -= (newW - targetW) / 2;
      targetW = newW;
    }

    if (targetW < 320) {
      const diffW = 320 - targetW;
      targetX -= diffW / 2;
      targetW = 320;
      targetH = 320 / aspect;
      targetY -= (targetH - (targetH * (targetW/320))) / 2;
    }
  }

  setMapZoomTarget(targetX, targetY, targetW, targetH);
}

/* ---------------- STEPPER HOVER & LOCK ---------------- */
function hoverPhaseSteps(tripIds) {
  if (lockedTripIds !== null) return;
  renderMap(tripIds);
}

function resetHoverPhase() {
  if (lockedTripIds !== null) return;
  renderMap(null);
}

function toggleLockPhase(tripIds, faseKey) {
  const isSame = lockedFaseKey === faseKey;
  lockedTripIds = isSame ? null : tripIds;
  lockedFaseKey = isSame ? null : faseKey;
  renderMap(lockedTripIds);
  updateLockedPhotos(lockedFaseKey, lockedTripIds);
  document.querySelectorAll(".simple-step").forEach(el => el.classList.remove("locked"));
  if (lockedFaseKey) {
    document.querySelectorAll(`.simple-step[data-fase="${lockedFaseKey}"]`).forEach(el => el.classList.add("locked"));
  }
}

function openLightbox(src) {
  const overlay = document.getElementById("lightboxOverlay");
  const img = document.getElementById("lightboxImg");
  if (!overlay || !img) return;
  img.src = src;
  overlay.classList.add("open");
}
function closeLightbox() {
  const overlay = document.getElementById("lightboxOverlay");
  if (overlay) overlay.classList.remove("open");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

function updateLockedPhotos(faseKey, tripIds) {
  const panel = document.getElementById("lockedPhotosPanel");
  if (!panel) return;
  if (!faseKey) { panel.style.display = "none"; return; }

  const fase = FASES[faseKey];
  const photos = FASE_PHOTOS[faseKey] || [];
  const faseTrips = TRIP.filter(i => i.fase === faseKey && (tripIds || []).includes(i.id));
  const starts = faseTrips.map(i => i.start).sort();
  const ends = faseTrips.map(i => i.end).sort();
  const dateStr = starts.length && ends.length ? fmtRange(starts[0], ends[ends.length - 1]) : "";

  const [hero, ...rest] = photos;

  const thumbsHtml = rest.length > 0
    ? `<div class="locked-photos-thumbs">${rest.map(src => `<img src="${src}" onclick="openLightbox('${src}')" loading="lazy" alt="">`).join("")}</div>`
    : "";

  panel.innerHTML = `
    <div class="locked-photo-wrap">
      ${hero ? `<img id="lockedPhotoHero" src="${hero}" class="locked-photo-hero" loading="lazy" alt="" onclick="openLightbox('${hero}')">` : `<div class="locked-photo-placeholder"><span>${fase.label}</span></div>`}
      ${thumbsHtml}
    </div>
    <div class="locked-phase-info">
      <div class="locked-phase-title" style="color:${fase.color}">${fase.label}</div>
      ${dateStr ? `<div class="locked-phase-dates">${dateStr}</div>` : ""}
      <div class="locked-phase-desc-text">${fase.desc || fase.uitleg || ""}</div>
    </div>
  `;
  panel.style.display = "block";
}

function renderRouteStepper() {
  const container = document.getElementById("routeStepper");
  const countBadge = document.getElementById("routeStepperCount");
  if (!container) return;

  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id));

  // Group trip items by phase
  const phases = [];
  const phaseMap = {};

  for (const item of personTrips) {
    if (!phaseMap[item.fase]) {
      phaseMap[item.fase] = {
        faseKey: item.fase,
        faseInfo: FASES[item.fase],
        start: item.start,
        end: item.end,
        tripIds: [item.id],
      };
      phases.push(phaseMap[item.fase]);
    } else {
      const p = phaseMap[item.fase];
      p.tripIds.push(item.id);
      if (item.start < p.start) p.start = item.start;
      if (item.end > p.end) p.end = item.end;
    }
  }

  if (countBadge) {
    countBadge.textContent = `${phases.length} regio's`;
  }

  let html = `<div class="simple-timeline">`;
  
  for (const p of phases) {
    // Collect all unique companions during this phase
    const companionsSet = new Set();
    for (const tid of p.tripIds) {
      const cmps = Object.keys(PERSON_TRIPS).filter(key => PERSON_TRIPS[key].includes(tid));
      for (const c of cmps) {
        companionsSet.add(c);
      }
    }
    const companions = Array.from(companionsSet);

    const nDays = Math.round((dateOf(p.end) - dateOf(p.start)) / 86400000) + 1;
    const durStr = nDays > 1 ? `${nDays} dgn` : "1 dag";

    let companionsHtml = "";
    if (companions.length > 0) {
      const chunks = [];
      for (let i = 0; i < companions.length; i += 5) {
        chunks.push(companions.slice(i, i + 5));
      }
      companionsHtml = `
        <div class="simple-step-companions-container">
          ${chunks.map(chunk => `
            <div class="simple-step-companions-row">
              ${chunk.map(ckey => {
                const pers = PERSONS[ckey];
                const init = pers.name.substring(0, 2);
                return `<span class="simple-companion-dot" style="background:${pers.color}" title="${pers.name}">${init}</span>`;
              }).join("")}
            </div>
          `).join("")}
        </div>
      `;
    }

    const color = p.faseInfo.color;
    const tripIdsJson = JSON.stringify(p.tripIds);

    const stepPhotos = (FASE_PHOTOS[p.faseKey] || []).slice(0, 3);
    const photoStripHtml = stepPhotos.length > 0
      ? `<div class="stepper-photos">${stepPhotos.map(src => `<img src="${src}" class="stepper-photo" loading="lazy" alt="" onclick="event.stopPropagation(); openLightbox('${src}')">`).join("")}</div>`
      : "";

    let airbnbUrl = null;
    for (const tid of p.tripIds) {
      const item = TRIP.find(i => i.id === tid);
      if (item && item.costs) {
        for (const cid of item.costs) {
          if (COSTS[cid] && COSTS[cid].url) {
            airbnbUrl = COSTS[cid].url;
            break;
          }
        }
      }
      if (airbnbUrl) break;
    }

    let airbnbHtml = "";
    if (airbnbUrl) {
      airbnbHtml = `
        <a href="${airbnbUrl}" target="_blank" rel="noopener" class="simple-step-airbnb" onclick="event.stopPropagation()" title="Bekijk Airbnb verblijf">
          🏠
        </a>
      `;
    }

    html += `
      <div class="simple-step" data-fase="${p.faseKey}"
           onclick='toggleLockPhase(${tripIdsJson}, "${p.faseKey}")'
           onmouseenter='hoverPhaseSteps(${tripIdsJson})'
           onmouseleave="resetHoverPhase()">
        <div class="simple-step-line" style="background: ${color}"></div>
        <div class="simple-step-node" style="color: ${color}"></div>
        <div class="simple-step-content">
          <div class="simple-step-header">
            <span class="simple-step-title" style="color: ${color}">${p.faseInfo.label}${airbnbHtml}</span>
          </div>
          <div class="simple-step-dates">
            <span>${fmtRange(p.start, p.end)}</span>
            <span class="simple-step-duration">${durStr}</span>
          </div>
          <div class="simple-step-desc">${p.faseInfo.uitleg || ""}</div>
          ${companionsHtml}
          ${photoStripHtml}
        </div>
      </div>
    `;
  }
  
  html += `</div>`;
  container.innerHTML = html;
}

function renderPersonSelector() {
  const container = document.getElementById("personSelector");
  if (!container) return;
  
  const activePerson = ls_get("selected_person", "matthew");
  
  let html = `<span class="person-selector-label">Bekijk weergave van:</span>`;
  html += `<div class="person-grid">`;
  html += PERSON_ORDER.map(key => {
    const p = PERSONS[key];
    const isActive = key === activePerson;
    const photo = localStorage.getItem(`mapphoto_${key}`);
    const avatarHtml = photo 
      ? `<img src="${photo}" alt="">` 
      : `<span class="avatar-initials" style="color:${p.color}">${p.name.substring(0, 2)}</span>`;

    return `
      <button class="person-card ${isActive ? 'active' : ''}" onclick="selectPerson('${key}')">
        <div class="person-card-avatar" style="border-color:${p.color}">
          ${avatarHtml}
        </div>
        <span class="person-card-name">${p.name}</span>
      </button>
    `;
  }).join("");
  html += `</div>`;
  
  container.innerHTML = html;
}

function selectPerson(key) {
  ls_set("selected_person", key);
  renderPersonSelector();
  recalcAll();
  renderMap();
  renderRouteStepper();
  renderDestinationsGallery();
  
  const groupPanel = document.getElementById("groupPanel");
  if (groupPanel) {
    groupPanel.innerHTML = PERSON_GROUP_INFO[key] || "";
  }
}

/* ---------------- RENDER: destinations gallery ---------------- */
function renderDestinationsGallery() {
  const container = document.getElementById("destinationsGallery");
  if (!container) return;

  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id));

  const phases = [];
  const seen = new Set();
  for (const item of personTrips) {
    if (!seen.has(item.fase)) {
      seen.add(item.fase);
      phases.push({ faseKey: item.fase, faseInfo: FASES[item.fase], start: item.start, end: item.end });
    } else {
      const p = phases.find(ph => ph.faseKey === item.fase);
      if (item.start < p.start) p.start = item.start;
      if (item.end > p.end) p.end = item.end;
    }
  }

  let html = "";
  for (const p of phases) {
    const photos = FASE_PHOTOS[p.faseKey] || [];
    if (photos.length === 0) continue;
    const color = p.faseInfo.color;
    const main = photos[0];
    const extras = photos.slice(1, 4);

    const extrasHtml = extras.length > 0
      ? `<div class="dest-extras">${extras.map(src => `<img src="${src}" loading="lazy" alt="" onclick="event.stopPropagation(); openLightbox('${src}')">`).join("")}</div>`
      : "";

    html += `
      <div class="dest-card" style="--color: ${color}">
        <img src="${main}" class="dest-bg" loading="lazy" alt="" onclick="openLightbox('${main}')">
        <div class="dest-overlay">
          ${extrasHtml}
          <div class="dest-info">
            <div class="dest-name">${p.faseInfo.label}</div>
            <div class="dest-dates">${fmtRange(p.start, p.end)}</div>
          </div>
        </div>
      </div>
    `;
  }

  container.innerHTML = html;
}

/* ---------------- INIT ---------------- */
function init() {
  renderPersonSelector();
  
  const activePerson = ls_get("selected_person", "matthew");
  const groupPanel = document.getElementById("groupPanel");
  if (groupPanel) {
    groupPanel.innerHTML = PERSON_GROUP_INFO[activePerson] || "";
  }
  
  renderMap();
  recalcAll();
  renderRouteStepper();
  renderDestinationsGallery();
}

window.addEventListener("DOMContentLoaded", init);
</script>
