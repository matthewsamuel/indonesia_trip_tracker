<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indonesië — Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="tripmap.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
/* De kaart naast de stepper: paneelvariant van tripmap.js */
#routemap { height: 420px; }
@media (max-width: 900px) { #routemap { height: 340px; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- TOP BAR & NAVIGATION -->
  <header class="app-header">
    <div class="app-brand">
      <h1>🧭 Reis naar Indonesië</h1>
      <div class="sub">29 aug – 30 sep 2026</div>
    </div>
    <nav class="app-nav">
      <a class="app-nav-link active" href="indonesia-tracker.html">🏠 Home</a>
      <a class="app-nav-link" href="indonesia-timeline.html">📅 Reisschema</a>
      <a class="app-nav-link" href="indonesia-map.html">🗺️ Reiskaart</a>
      <a class="app-nav-link" href="indonesia-live.html">📍 Live Tracker</a>
      <a class="app-nav-link" href="indonesia-health.html">🏥 Gezondheid</a>
      <a class="app-nav-link" href="indonesia-transport.html">🚇 Transport</a>
    </nav>
  </header>

  <!-- PERSON SELECTOR -->
  <div class="person-selector-container" id="personSelector"></div>

  <!-- QUICK STATS -->
  <div class="stat-row" id="statRow"></div>

  <!-- TOP ROW: REISGEZELSCHAP & KOSTEN (EQUAL HEIGHT) -->
  <div class="panel-grid-top">
    <!-- REISGEZELSCHAP -->
    <section class="panel group-panel-height">
      <h2>👥 Reisgezelschap</h2>
      <div id="groupPanel"></div>
    </section>

    <!-- KOSTEN DASHBOARD -->
    <section class="panel group-panel-height">
      <h2>💶 Kosten <span id="tbdPill"></span></h2>
      <div class="cost-flex">
        <div class="cost-totals" id="costTotals"></div>
        <div class="chart-container">
          <canvas id="costChart"></canvas>
        </div>
      </div>
    </section>
  </div>

  <!-- OPEN TO-DO'S: WAT MOET ER NOG GEBOEKT WORDEN -->
  <section class="panel todo-panel" id="todoPanel"></section>

  <!-- BOTTOM ROW: COMBINED ROUTE MAP & STEPPER -->
  <section class="panel combined-route-panel">
    <h2>🗺️ Route &amp; Verloop <span id="routeStepperCount" class="tbd-pill" style="margin-left:auto; background:var(--teal-soft); color:var(--teal); border-color:rgba(0,180,216,0.2)"></span></h2>
    <div class="combined-route-grid">
      <div class="route-left">
        <div class="route-stepper" id="routeStepper"></div>
      </div>
      <div class="route-right">
        <div id="routemap"></div>
        <div id="lockedPhotosPanel" class="locked-photos-panel" style="display:none"></div>
      </div>
    </div>
  </section>

  <!-- DESTINATIONS GALLERY -->
  <section class="panel destinations-panel">
    <h2>📸 Bestemmingen</h2>
    <div class="destinations-row" id="destinationsGallery"></div>
  </section>

  <footer class="note">Kosten zijn per persoon. Wijzigingen worden lokaal in de browser onthouden en gesynchroniseerd met het reisschema.</footer>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <img id="lightboxImg" src="" alt="">
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data.js"></script>
<script src="tripmap.js"></script>
<script>


let chartRef = null;
let lockedTripIds = null;
let lockedFaseKey = null;
let lockedGroupKey = null;

function getCostsForPerson(personKey) {
  const tripIds = PERSON_TRIPS[personKey] || [];
  const costIds = new Set();
  for (const item of TRIP) {
    if (tripIds.includes(item.id)) {
      for (const cid of item.costs) {
        costIds.add(cid);
      }
    }
  }
  return costIds;
}

function recalcAll(){
  const personKey = ls_get("selected_person", "matthew");
  const allowedCosts = getCostsForPerson(personKey);

  let total = 0, confirmed = 0, tbdCount = 0;
  const byCat = { vlucht:0, accommodatie:0, transport:0, activiteit:0 };
  for (const id in COSTS) {
    if (!allowedCosts.has(id)) continue;
    const v = costValue(id);
    const cat = COSTS[id].cat;
    if (v === null) { tbdCount++; continue; }
    total += v;
    byCat[cat] += v;
    if (isBooked(id)) confirmed += v;
  }
  
  document.getElementById("costTotals").innerHTML = `
    <div class="row"><span class="l">✈️ Vluchten</span><span class="v">€ ${(byCat.vlucht).toFixed(2)}</span></div>
    <div class="row"><span class="l">🏨 Accommodatie</span><span class="v">€ ${(byCat.accommodatie).toFixed(2)}</span></div>
    <div class="row"><span class="l">🚌 Transport (taxi/trein)</span><span class="v">€ ${(byCat.transport).toFixed(2)}</span></div>
    <div class="row"><span class="l">🎟️ Activiteiten</span><span class="v">€ ${(byCat.activiteit).toFixed(2)}</span></div>
    <div class="row"><span class="l">🔒 Geboekt &amp; Bevestigd</span><span class="v" style="color:var(--teal)">€ ${confirmed.toFixed(2)}</span></div>
    <div class="row total"><span class="l">Geschat Totaal (pp)</span><span class="v">€ ${total.toFixed(2)}</span></div>
  `;
  document.getElementById("tbdPill").innerHTML = tbdCount ? `<span class="tbd-pill">${tbdCount} open TBDs</span>` : "";

  const ctx = document.getElementById("costChart");
  const labels = ["Vluchten", "Accommodatie", "Transport", "Activiteiten"];
  const data = [byCat.vlucht, byCat.accommodatie, byCat.transport, byCat.activiteit];
  const colors = ["#4cc9f0", "#ffb703", "#4ad66d", "#f72585"];
  if (chartRef) chartRef.destroy();
  chartRef = new Chart(ctx, {
    type: "doughnut",
    data: { 
      labels, 
      datasets: [{ 
        data, 
        backgroundColor: colors, 
        borderWidth: 2,
        borderColor: "#0d111c",
        hoverOffset: 4
      }] 
    },
    options: {
      responsive: true, 
      maintainAspectRatio: false,
      plugins: { 
        legend: { 
          position: "bottom", 
          labels: { 
            boxWidth: 10, 
            color: "#94a3b8",
            font: { family: "Outfit", size: 11, weight: "500" } 
          } 
        } 
      }
    }
  });

  // Trip stats calculations
  const tripIds = PERSON_TRIPS[personKey] || [];
  // Chronologisch sorteren: de volgorde in TRIP is niet die van de reis, dus
  // zonder sortering pakken de periode en de aftelklok de verkeerde eerste etappe.
  const personTrips = sortTrips(TRIP.filter(i => tripIds.includes(i.id)));

  let countdownLabel, countdownVal;
  let doneDays = 0, totalDays = 0;
  let periodVal = "—";

  if (personTrips.length > 0) {
    // Laatste etappe qua startdatum is niet noodzakelijk die met de laatste einddatum
    const sStr = personTrips[0].start;
    const eStr = personTrips.reduce((max, i) => (i.end > max ? i.end : max), personTrips[0].end);
    const start = dateOf(sStr), end = dateOf(eStr);
    const t = today();
    if (t < start) { 
      countdownVal = Math.ceil((start - t)/86400000); 
      countdownLabel = "dagen tot vertrek"; 
    } else if (t <= end) { 
      countdownVal = Math.ceil((end - t)/86400000); 
      countdownLabel = "dagen te gaan"; 
    } else { 
      countdownVal = "✓"; 
      countdownLabel = "reis afgelopen"; 
    }
    doneDays = personTrips.filter(i => statusOf(i)==="voltooid").length;
    totalDays = personTrips.length;

    const sYear = sStr.slice(0, 4);
    const eYear = eStr.slice(0, 4);
    if (sYear === eYear) {
      periodVal = `${fmtRange(sStr, eStr)} <small>${sYear}</small>`;
    } else {
      periodVal = `${fmtShort(sStr)} ${sYear} – ${fmtShort(eStr)} ${eYear}`;
    }
  } else {
    countdownVal = "—";
    countdownLabel = "geen actieve data";
  }
  
  document.getElementById("statRow").innerHTML = `
    <div class="stat-card">
      <div class="label">📅 Aftelklok</div>
      <div class="value">${countdownVal} <small>${countdownLabel}</small></div>
    </div>
    <div class="stat-card">
      <div class="label">🛫 Periode</div>
      <div class="value" style="font-size: 18px; padding-top: 4px;">${periodVal}</div>
    </div>
    <div class="stat-card">
      <div class="label">🧗 Etappes Voltooid</div>
      <div class="value">${doneDays} <small>/ ${totalDays}</small></div>
    </div>
    <div class="stat-card">
      <div class="label">💶 Al geboekt</div>
      <div class="value">€${confirmed.toFixed(0)} <small>van €${total.toFixed(0)} pp</small></div>
    </div>
  `;
}

/* ---------------- OPEN TO-DO'S ----------------
   Toont per reiziger wat er nog geboekt of ingevuld moet worden: kosten zonder
   bedrag (TBD) en geboekte-vinkjes die nog openstaan. De datum van de bijhorende
   etappe bepaalt de urgentie, zodat het eerstvolgende altijd bovenaan staat. */
function renderTodoPanel() {
  const panel = document.getElementById("todoPanel");
  if (!panel) return;

  const personKey = getSelectedPerson();
  const tripIds = PERSON_TRIPS[personKey] || [];
  const trips = sortTrips(TRIP.filter(i => tripIds.includes(i.id)));

  // Eerste etappe waar elke kostenpost aan hangt, voor de datum en de context
  const costContext = {};
  for (const item of trips) {
    for (const cid of item.costs) {
      if (!costContext[cid]) costContext[cid] = item;
    }
  }

  const openItems = [];
  for (const cid in costContext) {
    const cost = COSTS[cid];
    if (!cost) continue;
    const item = costContext[cid];
    const value = costValue(cid);
    const booked = isBooked(cid);
    if (value === null) {
      openItems.push({ cid, cost, item, type: "prijs", label: "prijs onbekend" });
    } else if (!booked) {
      openItems.push({ cid, cost, item, type: "boeking", label: "nog niet geboekt" });
    }
  }

  openItems.sort((a, b) => a.item.start.localeCompare(b.item.start));

  const t = today();
  const totalKnown = openItems
    .filter(o => o.type === "boeking")
    .reduce((sum, o) => sum + (costValue(o.cid) || 0), 0);

  if (openItems.length === 0) {
    panel.innerHTML = `
      <h2>✅ Nog te boeken</h2>
      <p class="todo-empty">Alles is ingevuld en aangevinkt voor ${PERSONS[personKey].name}.</p>`;
    return;
  }

  const rows = openItems.map(o => {
    const dagen = Math.ceil((dateOf(o.item.start) - t) / 86400000);
    const urgent = dagen >= 0 && dagen <= 21;
    const verlopen = dagen < 0;
    const wanneer = verlopen
      ? "datum voorbij"
      : dagen === 0 ? "vandaag" : `over ${dagen} ${dagen === 1 ? "dag" : "dagen"}`;
    const bedrag = o.type === "prijs"
      ? `<span class="todo-amount is-tbd">TBD</span>`
      : `<span class="todo-amount">€ ${costValue(o.cid).toFixed(0)}</span>`;
    const link = o.cost.url
      ? `<a class="todo-link" href="${o.cost.url}" target="_blank" rel="noopener">openen →</a>`
      : "";
    return `
      <li class="todo-item ${verlopen ? "is-late" : urgent ? "is-urgent" : ""}">
        <span class="todo-type ${o.type}">${o.type === "prijs" ? "€?" : "☐"}</span>
        <span class="todo-body">
          <a class="todo-label" href="indonesia-timeline.html#${o.item.id}">${o.cost.label}</a>
          <span class="todo-meta">${fmtShort(o.item.start)} · ${wanneer} · ${o.label}</span>
        </span>
        ${bedrag}
        ${link}
      </li>`;
  }).join("");

  panel.innerHTML = `
    <h2>📌 Nog te boeken <span class="tbd-pill">${openItems.length}</span></h2>
    <p class="todo-intro">
      Openstaande punten voor <strong>${PERSONS[personKey].name}</strong>, op datum.
      ${totalKnown > 0 ? `Daarvan staat al <strong>€ ${totalKnown.toFixed(0)}</strong> vast qua prijs maar is nog niet geboekt.` : ""}
    </p>
    <ul class="todo-list">${rows}</ul>`;
}

/* ---------------- RENDER: kaart (tripmap.js) ----------------
   De kaart is het gedeelde TripMap-component. De stepper hiernaast stuurt
   hem aan via highlightTrips(); zonder selectie toont hij de dag van vandaag. */
let tripKaart = null;
let kaartVoorPersoon = null;

function initTripKaart(personKey) {
  tripKaart = TripMap.create({
    el: "#routemap",
    mode: "panel",
    person: personKey,
    day: "today",
    onTripSelect(id) { location.href = "indonesia-timeline.html#" + id; },
  });
}

function renderMap(highlightTripIds = null) {
  const personKey = ls_get("selected_person", "matthew");
  if (!tripKaart) {
    initTripKaart(personKey);
    kaartVoorPersoon = personKey;
  } else if (kaartVoorPersoon !== personKey) {
    tripKaart.setPerson(personKey);
    kaartVoorPersoon = personKey;
    if (lockedTripIds !== null) {
      lockedTripIds = null;
      lockedFaseKey = null;
      lockedGroupKey = null;
      updateLockedPhotos(null, null);
    }
  }
  tripKaart.highlightTrips(highlightTripIds);
}

/* ---------------- STEPPER HOVER & LOCK ---------------- */
function hoverPhaseSteps(tripIds) {
  if (lockedTripIds !== null) return;
  renderMap(tripIds);
}

function resetHoverPhase() {
  if (lockedTripIds !== null) return;
  renderMap(null);
}

function toggleLockPhase(tripIds, faseKey, groupKey) {
  const isSame = lockedGroupKey === groupKey;
  lockedTripIds = isSame ? null : tripIds;
  lockedFaseKey = isSame ? null : faseKey;
  lockedGroupKey = isSame ? null : groupKey;
  renderMap(lockedTripIds);
  updateLockedPhotos(lockedFaseKey, lockedTripIds);
  document.querySelectorAll(".simple-step").forEach(el => el.classList.remove("locked"));
  if (lockedGroupKey) {
    document.querySelectorAll(`.simple-step[data-group="${lockedGroupKey}"]`).forEach(el => el.classList.add("locked"));
  }
}

function openLightbox(src) {
  const overlay = document.getElementById("lightboxOverlay");
  const img = document.getElementById("lightboxImg");
  if (!overlay || !img) return;
  img.src = src;
  overlay.classList.add("open");
}
function closeLightbox() {
  const overlay = document.getElementById("lightboxOverlay");
  if (overlay) overlay.classList.remove("open");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

let lockedPhotoTimer = null;

function updateLockedPhotos(faseKey, tripIds) {
  const panel = document.getElementById("lockedPhotosPanel");
  if (!panel) return;
  if (lockedPhotoTimer) { clearInterval(lockedPhotoTimer); lockedPhotoTimer = null; }
  if (!faseKey) { panel.style.display = "none"; return; }

  const fase = FASES[faseKey];
  const personKey = ls_get("selected_person", "matthew");
  const tekstOv = getGroupUitleg(faseKey, tripIds, personKey);
  let photos = FASE_PHOTOS[faseKey] || [];
  if (personKey !== "matthew" && personKey !== "hinke") {
    photos = photos.filter(p => !p.includes("airbnbM&H"));
  }
  const faseTrips = TRIP.filter(i => i.fase === faseKey && (tripIds || []).includes(i.id));
  const starts = faseTrips.map(i => i.start).sort();
  const ends = faseTrips.map(i => i.end).sort();
  const dateStr = starts.length && ends.length ? fmtRange(starts[0], ends[ends.length - 1]) : "";

  const [hero, ...rest] = photos;

  const thumbsHtml = rest.length > 0
    ? `<div class="locked-photos-thumbs">${rest.map(src => `<img src="${src}" onclick="openLightbox('${src}')" loading="lazy" alt="">`).join("")}</div>`
    : "";

  panel.innerHTML = `
    <div class="locked-photo-wrap">
      ${hero ? `<img id="lockedPhotoHero" src="${hero}" class="locked-photo-hero" loading="lazy" alt="" onclick="openLightbox(this.src)">` : `<div class="locked-photo-placeholder"><span>${fase.label}</span></div>`}
      ${thumbsHtml}
    </div>
    <div class="locked-phase-info">
      <div class="locked-phase-title" style="color:${fase.color}">${fase.label}</div>
      ${dateStr ? `<div class="locked-phase-dates">${dateStr}</div>` : ""}
      <div class="locked-phase-desc-text">${tekstOv}</div>
    </div>
  `;
  panel.style.display = "block";

  if (photos.length > 1) {
    let idx = 0;
    const heroImg = document.getElementById("lockedPhotoHero");
    lockedPhotoTimer = setInterval(() => {
      idx = (idx + 1) % photos.length;
      heroImg.classList.add("fading");
      setTimeout(() => {
        heroImg.src = photos[idx];
        heroImg.classList.remove("fading");
      }, 300);
    }, 3000);
  }
}

function toggleStepperCollapse(groupKey) {
  const key = "collapsed_stepper_" + groupKey;
  const current = ls_get(key, false);
  ls_set(key, !current);
  renderRouteStepper();
}

function renderRouteStepper() {
  const container = document.getElementById("routeStepper");
  const countBadge = document.getElementById("routeStepperCount");
  if (!container) return;

  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = sortTrips(TRIP.filter(i => tripIds.includes(i.id)));

  // Group trip items by phase (and by companions only for Java) chronologically
  const phases = [];
  let currentGroup = null;

  for (const item of personTrips) {
    const cmps = Object.keys(PERSON_TRIPS).filter(key => PERSON_TRIPS[key].includes(item.id)).sort();
    const compKey = cmps.join(",");

    let shouldGroup = false;
    if (currentGroup && currentGroup.faseKey === item.fase) {
      if (item.fase === "java") {
        shouldGroup = (currentGroup.compKey === compKey);
      } else {
        shouldGroup = true;
      }
    }

    if (shouldGroup) {
      currentGroup.tripIds.push(item.id);
      if (item.start < currentGroup.start) currentGroup.start = item.start;
      if (item.end > currentGroup.end) currentGroup.end = item.end;
      
      // Update companions union for non-Java phases
      if (item.fase !== "java") {
        const unionSet = new Set([...currentGroup.companions, ...cmps]);
        currentGroup.companions = Array.from(unionSet).sort();
        currentGroup.compKey = currentGroup.companions.join(",");
      }
    } else {
      currentGroup = {
        faseKey: item.fase,
        faseInfo: FASES[item.fase],
        start: item.start,
        end: item.end,
        tripIds: [item.id],
        compKey: compKey,
        companions: cmps
      };
      phases.push(currentGroup);
    }
  }

  // Construct unique groupKeys
  phases.forEach(p => {
    p.groupKey = p.faseKey + "_" + p.start + "_" + p.end;
  });

  if (countBadge) {
    /* Geen "regio's": Java valt voor Matthew in twee blokken uiteen (met de
       groep tot Ijen, en na de ophaalvlucht samen met Hinke), met de
       Bali-tussenstop in Canggu ertussen. */
    countBadge.textContent = `${phases.length} ${phases.length === 1 ? "blok" : "blokken"}`;
  }

  let html = `<div class="simple-timeline">`;
  
  for (const p of phases) {
    const companions = p.companions;

    let companionsHtml = "";
    if (companions.length > 0) {
      const chunks = [];
      for (let i = 0; i < companions.length; i += 5) {
        chunks.push(companions.slice(i, i + 5));
      }
      companionsHtml = `
        <div class="simple-step-companions-container">
          ${chunks.map(chunk => `
            <div class="simple-step-companions-row">
              ${chunk.map(ckey => {
                const pers = PERSONS[ckey];
                // PERSONS.initials houdt Kamiel/Kasper en Matthew/Mathias/Maurice
                // uit elkaar; de eerste twee letters van de naam doen dat niet.
                return `<span class="simple-companion-dot" style="background:${pers.color}" title="${pers.name}">${pers.initials}</span>`;
              }).join("")}
            </div>
          `).join("")}
        </div>
      `;
    }

    const color = p.faseInfo.color;
    const tripIdsJson = JSON.stringify(p.tripIds);
    const tekstOv = getGroupUitleg(p.faseKey, p.tripIds, personKey);

    let stepPhotos = FASE_PHOTOS[p.faseKey] || [];
    if (personKey !== "matthew" && personKey !== "hinke") {
      stepPhotos = stepPhotos.filter(src => !src.includes("airbnbM&H"));
    }
    stepPhotos = stepPhotos.slice(0, 3);
    const photoStripHtml = stepPhotos.length > 0
      ? `<div class="stepper-photos">${stepPhotos.map(src => `<img src="${src}" class="stepper-photo" loading="lazy" alt="" onclick="event.stopPropagation(); openLightbox('${src}')">`).join("")}</div>`
      : "";

    let airbnbUrl = null;
    for (const tid of p.tripIds) {
      const item = TRIP.find(i => i.id === tid);
      if (item && item.costs) {
        for (const cid of item.costs) {
          if (COSTS[cid] && COSTS[cid].url) {
            airbnbUrl = COSTS[cid].url;
            break;
          }
        }
      }
      if (airbnbUrl) break;
    }

    let airbnbHtml = "";
    if (airbnbUrl) {
      airbnbHtml = `
        <a href="${airbnbUrl}" target="_blank" rel="noopener" class="simple-step-airbnb" onclick="event.stopPropagation()" title="Bekijk Airbnb verblijf">
          🏠
        </a>
      `;
    }

    const isStepperCollapsed = ls_get("collapsed_stepper_" + p.groupKey, false);

    // Bullet points van individuele trips om de sub-fases te duiden
    let tripTitlesHtml = "";
    if (p.tripIds.length > 0) {
      tripTitlesHtml = `
        <ul class="simple-step-trips" style="margin: 6px 0 0 16px; padding: 0; font-size: 13px; color: var(--text-soft); list-style-type: disc;">
          ${p.tripIds.map(tid => {
            const item = TRIP.find(t => t.id === tid);
            return `<li>${item ? item.title : ""}</li>`;
          }).join("")}
        </ul>
      `;
    }

    const isLocked = lockedGroupKey === p.groupKey;

    html += `
      <div class="simple-step ${isStepperCollapsed ? 'collapsed' : ''} ${isLocked ? 'locked' : ''}" 
           data-fase="${p.faseKey}" data-group="${p.groupKey}"
           onclick='toggleLockPhase(${tripIdsJson}, "${p.faseKey}", "${p.groupKey}")'
           onmouseenter='hoverPhaseSteps(${tripIdsJson})'
           onmouseleave="resetHoverPhase()">
         <div class="simple-step-line" style="background: ${color}"></div>
         <div class="simple-step-node" style="color: ${color}"></div>
         <div class="simple-step-content">
          <div class="simple-step-header">
            <span class="simple-step-title" style="color: ${color}">${p.faseInfo.label}${airbnbHtml}</span>
            <button class="simple-step-collapse-toggle" onclick="event.stopPropagation(); toggleStepperCollapse('${p.groupKey}')" title="${isStepperCollapsed ? 'Klap open' : 'Klap in'}">
              ▼
            </button>
          </div>
          <div class="simple-step-dates">
            <span>${fmtRange(p.start, p.end)}</span>
          </div>
          <div class="simple-step-desc">${tekstOv}</div>
          ${tripTitlesHtml}
          ${companionsHtml}
          ${photoStripHtml}
        </div>
      </div>
    `;
  }
  
  html += `</div>`;
  container.innerHTML = html;
}

/* ---------------- RENDER: destinations gallery ---------------- */
function renderDestinationsGallery() {
  const container = document.getElementById("destinationsGallery");
  if (!container) return;

  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = sortTrips(TRIP.filter(i => tripIds.includes(i.id)));

  const phases = [];
  const seen = new Set();
  for (const item of personTrips) {
    if (!seen.has(item.fase)) {
      seen.add(item.fase);
      phases.push({ faseKey: item.fase, faseInfo: FASES[item.fase], start: item.start, end: item.end });
    } else {
      const p = phases.find(ph => ph.faseKey === item.fase);
      if (item.start < p.start) p.start = item.start;
      if (item.end > p.end) p.end = item.end;
    }
  }

  let html = "";
  for (const p of phases) {
    let photos = FASE_PHOTOS[p.faseKey] || [];
    if (personKey !== "matthew" && personKey !== "hinke") {
      photos = photos.filter(src => !src.includes("airbnbM&H"));
    }
    if (photos.length === 0) continue;
    const color = p.faseInfo.color;
    const main = photos[0];
    const extras = photos.slice(1, 4);

    const extrasHtml = extras.length > 0
      ? `<div class="dest-extras">${extras.map(src => `<img src="${src}" loading="lazy" alt="" onclick="event.stopPropagation(); openLightbox('${src}')">`).join("")}</div>`
      : "";

    html += `
      <div class="dest-card" style="--color: ${color}">
        <img src="${main}" class="dest-bg" loading="lazy" alt="" onclick="openLightbox('${main}')">
        <div class="dest-overlay">
          ${extrasHtml}
          <div class="dest-info">
            <div class="dest-name">${p.faseInfo.label}</div>
            <div class="dest-dates">${fmtRange(p.start, p.end)}</div>
          </div>
        </div>
      </div>
    `;
  }

  container.innerHTML = html;
}

/* ---------------- INIT ---------------- */
function onPersonChange(key) {
  recalcAll();
  renderTodoPanel();
  renderMap();
  renderRouteStepper();
  renderDestinationsGallery();
  const groupPanel = document.getElementById("groupPanel");
  if (groupPanel) groupPanel.innerHTML = PERSON_GROUP_INFO[key] || "";
}

function init() {
  initPersonSelector({ onChange: onPersonChange });

  const activePerson = getSelectedPerson();
  const groupPanel = document.getElementById("groupPanel");
  if (groupPanel) {
    groupPanel.innerHTML = PERSON_GROUP_INFO[activePerson] || "";
  }
  
  renderMap();
  recalcAll();
  renderTodoPanel();
  renderRouteStepper();
  renderDestinationsGallery();
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
