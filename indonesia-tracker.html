<script>


let chartRef = null;
let lockedTripIds = null;
let lockedFaseKey = null;
let lockedGroupKey = null;

function getCostsForPerson(personKey) {
  const tripIds = PERSON_TRIPS[personKey] || [];
  const costIds = new Set();
  for (const item of TRIP) {
    if (tripIds.includes(item.id)) {
      for (const cid of item.costs) {
        costIds.add(cid);
      }
    }
  }
  return costIds;
}

function recalcAll(){
  const personKey = ls_get("selected_person", "matthew");
  const allowedCosts = getCostsForPerson(personKey);

  let total = 0, confirmed = 0, tbdCount = 0;
  const byCat = { vlucht:0, accommodatie:0, transport:0, activiteit:0 };
  for (const id in COSTS) {
    if (!allowedCosts.has(id)) continue;
    const v = costValue(id);
    const cat = COSTS[id].cat;
    if (v === null) { tbdCount++; continue; }
    total += v;
    byCat[cat] += v;
    if (isBooked(id)) confirmed += v;
  }
  
  document.getElementById("costTotals").innerHTML = `
    <div class="row"><span class="l">✈️ Vluchten</span><span class="v">€ ${(byCat.vlucht).toFixed(2)}</span></div>
    <div class="row"><span class="l">🏨 Accommodatie</span><span class="v">€ ${(byCat.accommodatie).toFixed(2)}</span></div>
    <div class="row"><span class="l">🚌 Transport (taxi/trein)</span><span class="v">€ ${(byCat.transport).toFixed(2)}</span></div>
    <div class="row"><span class="l">🎟️ Activiteiten</span><span class="v">€ ${(byCat.activiteit).toFixed(2)}</span></div>
    <div class="row"><span class="l">🔒 Geboekt &amp; Bevestigd</span><span class="v" style="color:var(--teal)">€ ${confirmed.toFixed(2)}</span></div>
    <div class="row total"><span class="l">Geschat Totaal (pp)</span><span class="v">€ ${total.toFixed(2)}</span></div>
  `;
  document.getElementById("tbdPill").innerHTML = tbdCount ? `<span class="tbd-pill">${tbdCount} open TBDs</span>` : "";

  const ctx = document.getElementById("costChart");
  const labels = ["Vluchten", "Accommodatie", "Transport", "Activiteiten"];
  const data = [byCat.vlucht, byCat.accommodatie, byCat.transport, byCat.activiteit];
  const colors = ["#4cc9f0", "#ffb703", "#4ad66d", "#f72585"];
  if (chartRef) chartRef.destroy();
  chartRef = new Chart(ctx, {
    type: "doughnut",
    data: { 
      labels, 
      datasets: [{ 
        data, 
        backgroundColor: colors, 
        borderWidth: 2,
        borderColor: "#0d111c",
        hoverOffset: 4
      }] 
    },
    options: {
      responsive: true, 
      maintainAspectRatio: false,
      plugins: { 
        legend: { 
          position: "bottom", 
          labels: { 
            boxWidth: 10, 
            color: "#94a3b8",
            font: { family: "Outfit", size: 11, weight: "500" } 
          } 
        } 
      }
    }
  });

  // Trip stats calculations
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id));

  let countdownLabel, countdownVal;
  let doneDays = 0, totalDays = 0;
  let periodVal = "—";

  if (personTrips.length > 0) {
    const start = dateOf(personTrips[0].start), end = dateOf(personTrips[personTrips.length-1].end);
    const t = today();
    if (t < start) { 
      countdownVal = Math.ceil((start - t)/86400000); 
      countdownLabel = "dagen tot vertrek"; 
    } else if (t <= end) { 
      countdownVal = Math.ceil((end - t)/86400000); 
      countdownLabel = "dagen te gaan"; 
    } else { 
      countdownVal = "✓"; 
      countdownLabel = "reis afgelopen"; 
    }
    doneDays = personTrips.filter(i => statusOf(i)==="voltooid").length;
    totalDays = personTrips.length;

    const sStr = personTrips[0].start;
    const eStr = personTrips[personTrips.length - 1].end;
    const sYear = sStr.slice(0, 4);
    const eYear = eStr.slice(0, 4);
    if (sYear === eYear) {
      periodVal = `${fmtRange(sStr, eStr)} <small>${sYear}</small>`;
    } else {
      periodVal = `${fmtShort(sStr)} ${sYear} – ${fmtShort(eStr)} ${eYear}`;
    }
  } else {
    countdownVal = "—";
    countdownLabel = "geen actieve data";
  }
  
  document.getElementById("statRow").innerHTML = `
    <div class="stat-card">
      <div class="label">📅 Aftelklok</div>
      <div class="value">${countdownVal} <small>${countdownLabel}</small></div>
    </div>
    <div class="stat-card">
      <div class="label">🛫 Periode</div>
      <div class="value" style="font-size: 18px; padding-top: 4px;">${periodVal}</div>
    </div>
    <div class="stat-card">
      <div class="label">🧗 Etappes Voltooid</div>
      <div class="value">${doneDays} <small>/ ${totalDays}</small></div>
    </div>
    <div class="stat-card">
      <div class="label">💶 Totaal Overzicht</div>
      <div class="value">€${total.toFixed(0)} <small>per persoon</small></div>
    </div>
  `;
}

/* ---------------- GEOGRAPHIC LOCATIONS (LAT/LNG) ---------------- */
const LOCS = {

  nusa_penida:{ lat: -8.7275, lng: 115.5444, name: "🏝️ Nusa Penida" },
  ubud:       { lat: -8.5069, lng: 115.2625, name: "🌾 Ubud" },
  amed:       { lat: -8.3375, lng: 115.6563, name: "🤿 Amed" },
  sidemen:    { lat: -8.4503, lng: 115.4326, name: "🌾 Sidemen" },
  agung:      { lat: -8.3433, lng: 115.5089, name: "🌋 Mount Agung" }
};

/* Perpendicular Bezier curvature helper for overlapping round-trip lines */
function getCurvePoints(from, to, factor = 0.12) {
  const p0 = [from.lat, from.lng];
  const p2 = [to.lat, to.lng];
  const dist = Math.hypot(p2[0] - p0[0], p2[1] - p0[1]);
  if (dist < 0.05 || factor === 0) {
    return [p0, p2];
  }
  const mid = [(p0[0] + p2[0]) / 2, (p0[1] + p2[1]) / 2];
  const dx = p2[0] - p0[0];
  const dy = p2[1] - p0[1];
  
  // Perpendicular offset (bends line to the right of direction vector)
  const offsetLat = -dy * factor;
  const offsetLng = dx * factor;
  
  const p1 = [mid[0] + offsetLat, mid[1] + offsetLng];
  
  const points = [];
  const steps = 30;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const mt = 1 - t;
    const lat = mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0];
    const lng = mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1];
    points.push([lat, lng]);
  }
  return points;
}

/* ---------------- RENDER: map & Leaflet ---------------- */
let map;
let cityLabelsGroup;
let routesGroup;
let activeTileLayer;
let mapBuiltFor = null;

const MAP = {
  route: [],
  personTrips: [],
  markers: {},
  polylines: [],
  defaultBounds: null
};

function initLeafletMap() {
  map = L.map('routemap', {
    center: [-2.5, 115],
    zoom: 5,
    zoomControl: false,
    attributionControl: true
  });
  
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  
  // Minimalist Donker kaartlaag
  activeTileLayer = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',
    { attribution: '© OpenStreetMap contributors, © CARTO', maxZoom: 19 }
  ).addTo(map);
  
  cityLabelsGroup = L.layerGroup().addTo(map);
  routesGroup = L.layerGroup().addTo(map);
}

function buildMap(personKey) {
  if (!map) initLeafletMap();
  
  // Maak bestaande lagen leeg
  cityLabelsGroup.clearLayers();
  routesGroup.clearLayers();
  MAP.markers = {};
  MAP.polylines = [];
  
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = tripIds.map(id => TRIP.find(t => t.id === id)).filter(Boolean);
  MAP.personTrips = personTrips;

  // Route bepalen: opeenvolgende unieke locaties
  const route = [];
  for (const item of personTrips) {
    for (const k of item.map) {
      if (!LOCS[k]) continue;
      const last = route[route.length - 1];
      if (last && last.k === k) {
        last.fases.add(item.fase);
        continue;
      }
      route.push({ k, fases: new Set([item.fase]) });
    }
  }
  MAP.route = route;

  // Eerste fase per locatie (bepaalt de dot kleur van de stad)
  const firstFase = {};
  for (const item of personTrips) {
    for (const k of item.map) {
      if (LOCS[k] && !(k in firstFase)) {
        firstFase[k] = item.fase;
      }
    }
  }

  // Lijnen tussen locaties tekenen
  for (let i = 0; i < route.length - 1; i++) {
    const k1 = route[i].k, k2 = route[i+1].k;
    const p1 = LOCS[k1], p2 = LOCS[k2];
    const phases = new Set([...route[i].fases, ...route[i+1].fases]);

    // Genereer gebogen lijn-coördinaten
    const curvePoints = getCurvePoints(p1, p2, 0.12);

    const poly = L.polyline(curvePoints, {
      color: 'rgba(0, 180, 216, 0.4)',
      weight: 2,
      dashArray: '5 4'
    }).addTo(routesGroup);

    MAP.polylines.push({ poly, from: k1, to: k2, fases: phases });
  }

  // Custom stad markers tekenen
  Object.keys(firstFase).forEach(k => {
    const loc = LOCS[k];
    const phaseColor = FASES[firstFase[k]].color;

    const marker = L.marker([loc.lat, loc.lng], {
      icon: L.divIcon({
        html: `
          <div class="map-city-label" style="--phase-color: ${phaseColor}">
            <div class="map-city-dot"></div>
            <span class="map-city-text">${loc.name}</span>
          </div>
        `,
        className: 'map-city-container',
        iconSize: [120, 20],
        iconAnchor: [5, 10]
      }),
      interactive: true
    }).addTo(cityLabelsGroup);

    marker.on('click', () => {
      const trip = personTrips.find(t => t.map.includes(k));
      if (trip) {
        window.location.href = `indonesia-timeline.html#${trip.id}`;
      }
    });

    MAP.markers[k] = marker;
  });

  // Bereken bounds (Brussel weglaten uit Indonesië-weergave)
  const boundsPts = [];
  Object.keys(firstFase).forEach(k => {
    if (k !== 'brussel') {
      boundsPts.push([LOCS[k].lat, LOCS[k].lng]);
    }
  });
  if (boundsPts.length > 0) {
    MAP.defaultBounds = L.latLngBounds(boundsPts);
    map.fitBounds(MAP.defaultBounds, { padding: [30, 30] });
  } else {
    MAP.defaultBounds = L.latLngBounds([[-10, 95], [10, 140]]);
    map.fitBounds(MAP.defaultBounds);
  }

  // Legenda: alleen fases die deze persoon echt heeft
  const phaseOrder = [];
  const seenF = new Set();
  for (const t of personTrips) {
    if (!seenF.has(t.fase)) { seenF.add(t.fase); phaseOrder.push(t.fase); }
  }
  document.getElementById("mapLegend").innerHTML = phaseOrder.map(fk =>
    `<span><i style="background:${FASES[fk].color}"></i>${FASES[fk].label}</span>`
  ).join("") + `<span><i style="background:#ff4d4d"></i>vandaag</span>`;
}

function updateMapHighlight(highlightTripIds) {
  if (!map) return;
  const route = MAP.route;
  let phase = null;
  const activeKeys = new Set();

  if (highlightTripIds && highlightTripIds.length > 0) {
    const firstTrip = MAP.personTrips.find(i => highlightTripIds.includes(i.id));
    if (firstTrip) phase = firstTrip.fase;

    for (const tid of highlightTripIds) {
      const item = TRIP.find(t => t.id === tid);
      if (item) {
        for (const mk of item.map) {
          if (LOCS[mk]) activeKeys.add(mk);
        }
      }
    }
  }

  const phaseColor = phase ? FASES[phase].color : null;

  // Steden updaten
  Object.entries(MAP.markers).forEach(([k, marker]) => {
    const el = marker.getElement();
    if (!el) return;

    el.classList.remove('is-active');

    if (!phase) {
      marker.setOpacity(k === 'brussel' ? 0 : 1);
      el.style.opacity = k === 'brussel' ? '0' : '1';
      const dotEl = el.querySelector('.map-city-dot');
      if (dotEl) dotEl.style.backgroundColor = '';
    } else if (activeKeys.has(k)) {
      el.classList.add('is-active');
      marker.setOpacity(1);
      el.style.opacity = '1';
      const dotEl = el.querySelector('.map-city-dot');
      if (dotEl) dotEl.style.backgroundColor = phaseColor;
    } else {
      marker.setOpacity(0.06);
      el.style.opacity = '0.06';
    }
  });

  // Lijnen updaten
  MAP.polylines.forEach(item => {
    const touchesBrussel = item.from === 'brussel' || item.to === 'brussel';
    const path = item.poly.getElement();
    if (!phase) {
      item.poly.setStyle({
        color: 'rgba(0, 180, 216, 0.4)',
        weight: 2,
        dashArray: '5 4',
        opacity: touchesBrussel ? 0 : 0.8
      });
      if (path) path.setAttribute('class', 'leaflet-interactive');
    } else if (activeKeys.has(item.from) && activeKeys.has(item.to) && item.fases.has(phase)) {
      item.poly.setStyle({
        color: phaseColor,
        weight: 3.5,
        dashArray: '8 6',
        opacity: 0.95
      });
      if (path) path.setAttribute('class', 'leaflet-interactive active-route-flow');
    } else if (activeKeys.has(item.from) || activeKeys.has(item.to)) {
      item.poly.setStyle({
        color: 'rgba(148, 163, 184, 0.25)',
        weight: 2,
        dashArray: '5 4',
        opacity: 0.5
      });
      if (path) path.setAttribute('class', 'leaflet-interactive');
    } else {
      item.poly.setStyle({
        opacity: 0.04
      });
      if (path) path.setAttribute('class', 'leaflet-interactive');
    }
  });

  // Fit bounds op actieve regio
  if (phase) {
    const boundsPts = [];
    activeKeys.forEach(k => {
      boundsPts.push([LOCS[k].lat, LOCS[k].lng]);
    });
    if (boundsPts.length > 0) {
      map.fitBounds(L.latLngBounds(boundsPts), { padding: [40, 40], animate: true });
    }
  } else {
    if (MAP.defaultBounds) {
      map.fitBounds(MAP.defaultBounds, { padding: [30, 30], animate: true });
    }
  }
}

function renderMap(highlightTripIds = null) {
  const personKey = ls_get("selected_person", "matthew");
  if (mapBuiltFor !== personKey) {
    buildMap(personKey);
    mapBuiltFor = personKey;
    if (lockedTripIds !== null) {
      lockedTripIds = null;
      lockedFaseKey = null;
      lockedGroupKey = null;
      updateLockedPhotos(null, null);
    }
  }
  updateMapHighlight(highlightTripIds);
}

/* ---------------- STEPPER HOVER & LOCK ---------------- */
function hoverPhaseSteps(tripIds) {
  if (lockedTripIds !== null) return;
  renderMap(tripIds);
}

function resetHoverPhase() {
  if (lockedTripIds !== null) return;
  renderMap(null);
}

function toggleLockPhase(tripIds, faseKey, groupKey) {
  const isSame = lockedGroupKey === groupKey;
  lockedTripIds = isSame ? null : tripIds;
  lockedFaseKey = isSame ? null : faseKey;
  lockedGroupKey = isSame ? null : groupKey;
  renderMap(lockedTripIds);
  updateLockedPhotos(lockedFaseKey, lockedTripIds);
  document.querySelectorAll(".simple-step").forEach(el => el.classList.remove("locked"));
  if (lockedGroupKey) {
    document.querySelectorAll(`.simple-step[data-group="${lockedGroupKey}"]`).forEach(el => el.classList.add("locked"));
  }
}

function openLightbox(src) {
  const overlay = document.getElementById("lightboxOverlay");
  const img = document.getElementById("lightboxImg");
  if (!overlay || !img) return;
  img.src = src;
  overlay.classList.add("open");
}
function closeLightbox() {
  const overlay = document.getElementById("lightboxOverlay");
  if (overlay) overlay.classList.remove("open");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

let lockedPhotoTimer = null;

function updateLockedPhotos(faseKey, tripIds) {
  const panel = document.getElementById("lockedPhotosPanel");
  if (!panel) return;
  if (lockedPhotoTimer) { clearInterval(lockedPhotoTimer); lockedPhotoTimer = null; }
  if (!faseKey) { panel.style.display = "none"; return; }

  const fase = FASES[faseKey];
  const personKey = ls_get("selected_person", "matthew");
  const tekstOv = getGroupUitleg(faseKey, tripIds, personKey);
  let photos = FASE_PHOTOS[faseKey] || [];
  if (personKey !== "matthew" && personKey !== "hinke") {
    photos = photos.filter(p => !p.includes("airbnbM&H"));
  }
  const faseTrips = TRIP.filter(i => i.fase === faseKey && (tripIds || []).includes(i.id));
  const starts = faseTrips.map(i => i.start).sort();
  const ends = faseTrips.map(i => i.end).sort();
  const dateStr = starts.length && ends.length ? fmtRange(starts[0], ends[ends.length - 1]) : "";

  const [hero, ...rest] = photos;

  const thumbsHtml = rest.length > 0
    ? `<div class="locked-photos-thumbs">${rest.map(src => `<img src="${src}" onclick="openLightbox('${src}')" loading="lazy" alt="">`).join("")}</div>`
    : "";

  panel.innerHTML = `
    <div class="locked-photo-wrap">
      ${hero ? `<img id="lockedPhotoHero" src="${hero}" class="locked-photo-hero" loading="lazy" alt="" onclick="openLightbox(this.src)">` : `<div class="locked-photo-placeholder"><span>${fase.label}</span></div>`}
      ${thumbsHtml}
    </div>
    <div class="locked-phase-info">
      <div class="locked-phase-title" style="color:${fase.color}">${fase.label}</div>
      ${dateStr ? `<div class="locked-phase-dates">${dateStr}</div>` : ""}
      <div class="locked-phase-desc-text">${tekstOv}</div>
    </div>
  `;
  panel.style.display = "block";

  if (photos.length > 1) {
    let idx = 0;
    const heroImg = document.getElementById("lockedPhotoHero");
    lockedPhotoTimer = setInterval(() => {
      idx = (idx + 1) % photos.length;
      heroImg.classList.add("fading");
      setTimeout(() => {
        heroImg.src = photos[idx];
        heroImg.classList.remove("fading");
      }, 300);
    }, 3000);
  }
}

function toggleStepperCollapse(groupKey) {
  const key = "collapsed_stepper_" + groupKey;
  const current = ls_get(key, false);
  ls_set(key, !current);
  renderRouteStepper();
}

function renderRouteStepper() {
  const container = document.getElementById("routeStepper");
  const countBadge = document.getElementById("routeStepperCount");
  if (!container) return;

  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id)).sort((a, b) => a.start.localeCompare(b.start));

  // Group trip items by phase (and by companions only for Java) chronologically
  const phases = [];
  let currentGroup = null;

  for (const item of personTrips) {
    const cmps = Object.keys(PERSON_TRIPS).filter(key => PERSON_TRIPS[key].includes(item.id)).sort();
    const compKey = cmps.join(",");

    let shouldGroup = false;
    if (currentGroup && currentGroup.faseKey === item.fase) {
      if (item.fase === "java") {
        shouldGroup = (currentGroup.compKey === compKey);
      } else {
        shouldGroup = true;
      }
    }

    if (shouldGroup) {
      currentGroup.tripIds.push(item.id);
      if (item.start < currentGroup.start) currentGroup.start = item.start;
      if (item.end > currentGroup.end) currentGroup.end = item.end;
      
      // Update companions union for non-Java phases
      if (item.fase !== "java") {
        const unionSet = new Set([...currentGroup.companions, ...cmps]);
        currentGroup.companions = Array.from(unionSet).sort();
        currentGroup.compKey = currentGroup.companions.join(",");
      }
    } else {
      currentGroup = {
        faseKey: item.fase,
        faseInfo: FASES[item.fase],
        start: item.start,
        end: item.end,
        tripIds: [item.id],
        compKey: compKey,
        companions: cmps
      };
      phases.push(currentGroup);
    }
  }

  // Construct unique groupKeys
  phases.forEach(p => {
    p.groupKey = p.faseKey + "_" + p.start + "_" + p.end;
  });

  if (countBadge) {
    countBadge.textContent = `${phases.length} regio's`;
  }

  let html = `<div class="simple-timeline">`;
  
  for (const p of phases) {
    const companions = p.companions;

    let companionsHtml = "";
    if (companions.length > 0) {
      const chunks = [];
      for (let i = 0; i < companions.length; i += 5) {
        chunks.push(companions.slice(i, i + 5));
      }
      companionsHtml = `
        <div class="simple-step-companions-container">
          ${chunks.map(chunk => `
            <div class="simple-step-companions-row">
              ${chunk.map(ckey => {
                const pers = PERSONS[ckey];
                const init = pers.name.substring(0, 2);
                return `<span class="simple-companion-dot" style="background:${pers.color}" title="${pers.name}">${init}</span>`;
              }).join("")}
            </div>
          `).join("")}
        </div>
      `;
    }

    const color = p.faseInfo.color;
    const tripIdsJson = JSON.stringify(p.tripIds);
    const tekstOv = getGroupUitleg(p.faseKey, p.tripIds, personKey);

    let stepPhotos = FASE_PHOTOS[p.faseKey] || [];
    if (personKey !== "matthew" && personKey !== "hinke") {
      stepPhotos = stepPhotos.filter(src => !src.includes("airbnbM&H"));
    }
    stepPhotos = stepPhotos.slice(0, 3);
    const photoStripHtml = stepPhotos.length > 0
      ? `<div class="stepper-photos">${stepPhotos.map(src => `<img src="${src}" class="stepper-photo" loading="lazy" alt="" onclick="event.stopPropagation(); openLightbox('${src}')">`).join("")}</div>`
      : "";

    let airbnbUrl = null;
    for (const tid of p.tripIds) {
      const item = TRIP.find(i => i.id === tid);
      if (item && item.costs) {
        for (const cid of item.costs) {
          if (COSTS[cid] && COSTS[cid].url) {
            airbnbUrl = COSTS[cid].url;
            break;
          }
        }
      }
      if (airbnbUrl) break;
    }

    let airbnbHtml = "";
    if (airbnbUrl) {
      airbnbHtml = `
        <a href="${airbnbUrl}" target="_blank" rel="noopener" class="simple-step-airbnb" onclick="event.stopPropagation()" title="Bekijk Airbnb verblijf">
          🏠
        </a>
      `;
    }

    const isStepperCollapsed = ls_get("collapsed_stepper_" + p.groupKey, false);

    // Bullet points van individuele trips om de sub-fases te duiden
    let tripTitlesHtml = "";
    if (p.tripIds.length > 0) {
      tripTitlesHtml = `
        <ul class="simple-step-trips" style="margin: 6px 0 0 16px; padding: 0; font-size: 13px; color: var(--text-soft); list-style-type: disc;">
          ${p.tripIds.map(tid => {
            const item = TRIP.find(t => t.id === tid);
            return `<li>${item ? item.title : ""}</li>`;
          }).join("")}
        </ul>
      `;
    }

    const isLocked = lockedGroupKey === p.groupKey;

    html += `
      <div class="simple-step ${isStepperCollapsed ? 'collapsed' : ''} ${isLocked ? 'locked' : ''}" 
           data-fase="${p.faseKey}" data-group="${p.groupKey}"
           onclick='toggleLockPhase(${tripIdsJson}, "${p.faseKey}", "${p.groupKey}")'
           onmouseenter='hoverPhaseSteps(${tripIdsJson})'
           onmouseleave="resetHoverPhase()">
         <div class="simple-step-line" style="background: ${color}"></div>
         <div class="simple-step-node" style="color: ${color}"></div>
         <div class="simple-step-content">
          <div class="simple-step-header">
            <span class="simple-step-title" style="color: ${color}">${p.faseInfo.label}${airbnbHtml}</span>
            <button class="simple-step-collapse-toggle" onclick="event.stopPropagation(); toggleStepperCollapse('${p.groupKey}')" title="${isStepperCollapsed ? 'Klap open' : 'Klap in'}">
              ▼
            </button>
          </div>
          <div class="simple-step-dates">
            <span>${fmtRange(p.start, p.end)}</span>
          </div>
          <div class="simple-step-desc">${tekstOv}</div>
          ${tripTitlesHtml}
          ${companionsHtml}
          ${photoStripHtml}
        </div>
      </div>
    `;
  }
  
  html += `</div>`;
  container.innerHTML = html;
}

function renderPersonSelector() {
  const container = document.getElementById("personSelector");
  if (!container) return;
  
  const activePerson = ls_get("selected_person", "matthew");
  const isCollapsed = ls_get("person_selector_collapsed", false);
  
  let html = `
    <div class="person-selector-header" onclick="togglePersonSelector()" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; width:100%;">
      <span class="person-selector-label" style="margin-bottom:0;">Bekijk weergave van: <strong style="color:var(--teal); text-transform:none; font-size:12px; margin-left:6px;">${PERSONS[activePerson].name}</strong></span>
      <span class="person-selector-toggle-arrow" style="font-size:10px; color:var(--text-soft); transition: transform 0.2s ease; ${isCollapsed ? 'transform:rotate(-90deg);' : ''}">▼</span>
    </div>
  `;
  
  html += `<div class="person-grid" style="${isCollapsed ? 'display:none;' : ''}">`;
  html += PERSON_ORDER.map(key => {
    const p = PERSONS[key];
    const isActive = key === activePerson;
    const photo = localStorage.getItem(`mapphoto_${key}`);
    const avatarHtml = photo 
      ? `<img src="${photo}" alt="">` 
      : `<span class="avatar-initials" style="color:${p.color}">${p.name.substring(0, 2)}</span>`;

    return `
      <button class="person-card ${isActive ? 'active' : ''}" onclick="selectPerson('${key}')">
        <div class="person-card-avatar" style="border-color:${p.color}">
          ${avatarHtml}
        </div>
        <span class="person-card-name">${p.name}</span>
      </button>
    `;
  }).join("");
  html += `</div>`;
  
  container.innerHTML = html;
}

function togglePersonSelector() {
  const isCollapsed = ls_get("person_selector_collapsed", false);
  ls_set("person_selector_collapsed", !isCollapsed);
  renderPersonSelector();
}

function selectPerson(key) {
  ls_set("selected_person", key);
  renderPersonSelector();
  recalcAll();
  renderMap();
  renderRouteStepper();
  renderDestinationsGallery();
  
  const groupPanel = document.getElementById("groupPanel");
  if (groupPanel) {
    groupPanel.innerHTML = PERSON_GROUP_INFO[key] || "";
  }
}

/* ---------------- RENDER: destinations gallery ---------------- */
function renderDestinationsGallery() {
  const container = document.getElementById("destinationsGallery");
  if (!container) return;

  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id)).sort((a, b) => a.start.localeCompare(b.start));

  const phases = [];
  const seen = new Set();
  for (const item of personTrips) {
    if (!seen.has(item.fase)) {
      seen.add(item.fase);
      phases.push({ faseKey: item.fase, faseInfo: FASES[item.fase], start: item.start, end: item.end });
    } else {
      const p = phases.find(ph => ph.faseKey === item.fase);
      if (item.start < p.start) p.start = item.start;
      if (item.end > p.end) p.end = item.end;
    }
  }

  let html = "";
  for (const p of phases) {
    let photos = FASE_PHOTOS[p.faseKey] || [];
    if (personKey !== "matthew" && personKey !== "hinke") {
      photos = photos.filter(src => !src.includes("airbnbM&H"));
    }
    if (photos.length === 0) continue;
    const color = p.faseInfo.color;
    const main = photos[0];
    const extras = photos.slice(1, 4);

    const extrasHtml = extras.length > 0
      ? `<div class="dest-extras">${extras.map(src => `<img src="${src}" loading="lazy" alt="" onclick="event.stopPropagation(); openLightbox('${src}')">`).join("")}</div>`
      : "";

    html += `
      <div class="dest-card" style="--color: ${color}">
        <img src="${main}" class="dest-bg" loading="lazy" alt="" onclick="openLightbox('${main}')">
        <div class="dest-overlay">
          ${extrasHtml}
          <div class="dest-info">
            <div class="dest-name">${p.faseInfo.label}</div>
            <div class="dest-dates">${fmtRange(p.start, p.end)}</div>
          </div>
        </div>
      </div>
    `;
  }

  container.innerHTML = html;
}

/* ---------------- INIT ---------------- */
function init() {
  renderPersonSelector();
  
  const activePerson = ls_get("selected_person", "matthew");
  const groupPanel = document.getElementById("groupPanel");
  if (groupPanel) {
    groupPanel.innerHTML = PERSON_GROUP_INFO[activePerson] || "";
  }
  
  renderMap();
  recalcAll();
  renderRouteStepper();
  renderDestinationsGallery();
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
