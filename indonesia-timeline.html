/* ---------------- HELPERS ---------------- */
const MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function fmtShort(d){ const dt=new Date(d+"T00:00:00"); return dt.getDate()+" "+MONTHS[dt.getMonth()]; }
function fmtRange(s,e){ return s===e ? fmtShort(s) : (s.slice(0,7)===e.slice(0,7) ? new Date(s+"T00:00:00").getDate()+"–"+fmtShort(e) : fmtShort(s)+" – "+fmtShort(e)); }

function today(){ return new Date(new Date().toDateString()); }
function dateOf(s){ return new Date(s+"T00:00:00"); }

function statusOf(item){
  const t = today();
  const s = dateOf(item.start), e = dateOf(item.end);
  if (e < t) return "voltooid";
  if (s <= t && t <= e) return "bezig";
  const days = (s - t) / 86400000;
  if (days <= 10) return "binnenkort";
  return "gepland";
}
const STATUS_LABEL = { voltooid:"voltooid", bezig:"nu bezig", binnenkort:"binnenkort", gepland:"gepland" };

function ls_get(key, fallback){ try { const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); } catch(e){ return fallback; } }
function ls_set(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

function costValue(id){
  const stored = ls_get("cost_"+id, undefined);
  if (stored !== undefined && stored !== "") return Number(stored);
  const def = COSTS[id].amount;
  return def === null ? null : def;
}
function isBooked(id){ return ls_get("booked_"+id, false); }

/* ---------------- RENDER: phase nav ---------------- */
function renderPhaseNav(){
  const nav = document.getElementById("phaseNav");
  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const personTrips = TRIP.filter(i => tripIds.includes(i.id));
  const visitedFases = new Set(personTrips.map(i => i.fase));

  nav.innerHTML = Object.entries(FASES).map(([k,f]) => {
    if (!visitedFases.has(k)) return "";
    return `<button class="fase-nav-btn" onclick="document.getElementById('fase-${k}').scrollIntoView({behavior:'smooth',block:'start'})">
      <span class="dot" style="background:${f.color}"></span>${f.label}
    </button>`;
  }).join("");
}

  let html = "";
  let lastFase = null;
  for (const item of TRIP) {
    if (!tripIds.includes(item.id)) continue;
    if (item.fase !== lastFase) {
      const f = FASES[item.fase];
      html += `<div class="fase-header" id="fase-${item.fase}"><span class="dot" style="color:${f.color}; background:${f.color}"></span>${f.label}</div>`;
      lastFase = item.fase;
    }
    const st = statusOf(item);
    const note = ls_get("note_"+item.id, "");
    const nDays = Math.round((dateOf(item.end) - dateOf(item.start)) / 86400000) + 1;
    const durStr = nDays > 1 ? `<span class="dur">${nDays} dagen</span>` : "";
    html += `
    <div class="timeline-item" id="${item.id}">
      <div class="when">${fmtRange(item.start,item.end)}<span class="yr">2026</span>${durStr}</div>
      <div class="timeline-node"></div>
      <div class="item-card">
        <div class="item-head">
          <h3>${item.title}</h3>
          <span class="badge ${st}">${STATUS_LABEL[st]}</span>
        </div>
        ${item.details.length ? `<ul class="details">${item.details.map(d=>`<li>${d}</li>`).join("")}</ul>` : ""}
        ${photoStripHtml(item)}
        ${item.costs.length ? `<div class="costs">${item.costs.map(cid => costLineHtml(cid)).join("")}</div>` : ""}
        <div class="item-foot">
          <textarea class="note" data-item="${item.id}" placeholder="${item.openNote ? 'Nog in te vullen — typ hier de plannen…' : 'Notitie toevoegen…'}">${note}</textarea>
        </div>
      </div>
    </div>`;
  }
  el.innerHTML = html;

  // Add event listeners to input fields
  el.querySelectorAll("input.cost-input").forEach(inp => {
    inp.addEventListener("input", () => { ls_set("cost_"+inp.dataset.cost, inp.value); });
  });
  el.querySelectorAll("input.booked-cb").forEach(cb => {
    cb.addEventListener("change", () => { ls_set("booked_"+cb.dataset.cost, cb.checked); });
  });
  el.querySelectorAll("textarea.note").forEach(ta => {
    ta.addEventListener("input", () => ls_set("note_"+ta.dataset.item, ta.value));
  });
}

function getPhotos(id){
  return (TRIP_DEFAULT_PHOTOS[id] || []).filter(Boolean);
}

function openLightbox(src){
  const overlay = document.getElementById("lightboxOverlay");
  const img = document.getElementById("lightboxImg");
  if (!overlay || !img) return;
  img.src = src;
  overlay.classList.add("open");
}
function closeLightbox(){
  const overlay = document.getElementById("lightboxOverlay");
  if (overlay) overlay.classList.remove("open");
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

function photoStripHtml(item){
  const photos = getPhotos(item.id);
  if (photos.length === 0) return "";
  const slots = photos.map(src =>
    `<div class="photo-slot" onclick="openLightbox('${src}')"><img src="${src}" alt="foto" loading="lazy"></div>`
  );
  return `<p class="photo-strip-label">Foto's</p><div class="photo-strip">${slots.join("")}</div>`;
}

function costLineHtml(cid){
  const c = COSTS[cid];
  const v = costValue(cid);
  const booked = isBooked(cid);
  const linkHtml = c.url ? `<a class="cost-url" href="${c.url}" target="_blank" rel="noopener" title="Bekijk details">Link →</a>` : "";
  return `<div class="cost-line">
    <span class="clabel">${c.label}</span>
    ${linkHtml}
    <span class="cur">€</span>
    <input class="cost-input" type="number" step="0.01" data-cost="${cid}" value="${v===null?'':v}" placeholder="?">
    <label class="booked"><input type="checkbox" class="booked-cb" data-cost="${cid}" ${booked?"checked":""}> geboekt</label>
  </div>`;
}

function renderPersonSelector() {
  const container = document.getElementById("personSelector");
  if (!container) return;
  
  const activePerson = ls_get("selected_person", "matthew");
  
  let html = `<span class="person-selector-label">Bekijk weergave van:</span>`;
  html += `<div class="person-grid">`;
  html += PERSON_ORDER.map(key => {
    const p = PERSONS[key];
    const isActive = key === activePerson;
    const photo = localStorage.getItem(`mapphoto_${key}`);
    const avatarHtml = photo 
      ? `<img src="${photo}" alt="">` 
      : `<span class="avatar-initials" style="color:${p.color}">${p.name.substring(0, 2)}</span>`;

    return `
      <button class="person-card ${isActive ? 'active' : ''}" onclick="selectPerson('${key}')">
        <div class="person-card-avatar" style="border-color:${p.color}">
          ${avatarHtml}
        </div>
        <span class="person-card-name">${p.name}</span>
      </button>
    `;
  }).join("");
  html += `</div>`;
  
  container.innerHTML = html;
}

function selectPerson(key) {
  ls_set("selected_person", key);
  renderPersonSelector();
  renderPhaseNav();
  renderTimeline();
}

/* ---------------- INIT ---------------- */
function init() {
  renderPersonSelector();
  renderPhaseNav();
  renderTimeline();
  
  if (window.location.hash) {
    setTimeout(() => {
      const el = document.querySelector(window.location.hash);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  }
}

window.addEventListener("DOMContentLoaded", init);
