const MONTHS = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function fmtShort(d){ const dt=new Date(d+"T00:00:00"); return dt.getDate()+" "+MONTHS[dt.getMonth()]; }
function fmtRange(s,e){ return s===e ? fmtShort(s) : (s.slice(0,7)===e.slice(0,7) ? new Date(s+"T00:00:00").getDate()+"–"+fmtShort(e) : fmtShort(s)+" – "+fmtShort(e)); }

function today(){ return new Date(new Date().toDateString()); }
function dateOf(s){ return new Date(s+"T00:00:00"); }

function statusOf(item){
  const t = today();
  const s = dateOf(item.start), e = dateOf(item.end);
  if (e < t) return "voltooid";
  if (s <= t && t <= e) return "bezig";
  const days = (s - t) / 86400000;
  if (days <= 10) return "binnenkort";
  return "gepland";
}
const STATUS_LABEL = { voltooid:"voltooid", bezig:"nu bezig", binnenkort:"binnenkort", gepland:"gepland" };

function ls_get(key, fallback){ try { const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); } catch(e){ return fallback; } }
function ls_set(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

/* ── NEW ITINERARY HELPERS ── */
const TRIP_START_DATE = "2026-08-28";

function getTripDayRange(startStr, endStr) {
  const tripStart = new Date(TRIP_START_DATE + "T00:00:00");
  const s = new Date(startStr + "T00:00:00");
  const e = new Date(endStr + "T00:00:00");
  const startDay = Math.round((s - tripStart) / 86400000) + 1;
  const endDay = Math.round((e - tripStart) / 86400000) + 1;
  return startDay === endDay ? `Dag ${startDay}` : `Dag ${startDay} – ${endDay}`;
}

function parseDetails(detailsArray) {
  const transport = [];
  const stay = [];
  const tips = [];
  const activities = [];

  detailsArray.forEach(d => {
    const lower = d.toLowerCase();
    
    // Tips
    if (lower.startsWith("tip:") || lower.startsWith("let op:")) {
      tips.push(d.replace(/^(tip:|let op:)\s*/i, ""));
      return;
    }
    
    // Transport & Flights
    if (
      lower.includes("vlucht") || 
      lower.includes("vliegen") || 
      lower.includes("overstap") || 
      lower.includes("reistijd") || 
      lower.includes("trein") || 
      lower.includes("nachttrein") || 
      lower.includes("taxi") || 
      lower.includes("minibus") || 
      lower.includes("transfer") || 
      lower.includes("rit van") || 
      lower.includes("mrt") || 
      lower.includes("ov-kaart") ||
      lower.includes("tg935") ||
      lower.includes("tg403") ||
      lower.includes("lion air") ||
      lower.includes("denpasar") ||
      lower.includes("brussel → bangkok")
    ) {
      transport.push(d);
      return;
    }
    
    // Stay & Accommodations
    if (
      lower.includes("hotel") || 
      lower.includes("guesthouse") || 
      lower.includes("villa") || 
      lower.includes("overnachting") || 
      lower.includes("inchecken") || 
      lower.includes("check-in") || 
      lower.includes("verblijf") ||
      lower.includes("stay")
    ) {
      stay.push(d);
      return;
    }
    
    // Activities / Program
    activities.push(d);
  });

  return { transport, stay, tips, activities };
}

function getAccommodationUrl(item) {
  if (TRIP_AIRBNB_LINKS[item.id]) {
    return TRIP_AIRBNB_LINKS[item.id];
  }
  for (const cid of item.costs) {
    const cost = COSTS[cid];
    if (cost && cost.cat === "accommodatie" && cost.url) {
      return cost.url;
    }
  }
  return null;
}

function getPhaseStats(faseKey, tripIds) {
  const phaseItems = TRIP.filter(item => item.fase === faseKey && tripIds.includes(item.id));
  if (phaseItems.length === 0) return null;
  
  let minDate = phaseItems[0].start;
  let maxDate = phaseItems[0].end;
  let totalCost = 0;
  
  phaseItems.forEach(item => {
    if (item.start < minDate) minDate = item.start;
    if (item.end > maxDate) maxDate = item.end;
    
    item.costs.forEach(cid => {
      const v = costValue(cid);
      if (v !== null) {
        totalCost += v;
      }
    });
  });
  
  const tripStart = new Date(minDate + "T00:00:00");
  const tripEnd = new Date(maxDate + "T00:00:00");
  const days = Math.round((tripEnd - tripStart) / 86400000) + 1;
  
  return {
    dateRange: fmtRange(minDate, maxDate),
    days,
    totalCost: totalCost > 0 ? totalCost.toFixed(2) : null
  };
}

function costValue(id){
  const stored = ls_get("cost_"+id, undefined);
  if (stored !== undefined && stored !== "") return Number(stored);
  const def = COSTS[id].amount;
  return def === null ? null : def;
}

function isFlight(item) {
  if (item.fase === 'heen') return true;
  if (item.title.toLowerCase().includes('vlucht') || item.title.toLowerCase().includes('vliegen') || item.title.toLowerCase().includes('terugvlucht')) return true;
  if (item.costs.some(cid => COSTS[cid] && COSTS[cid].cat === 'vlucht')) return true;
  if (item.details.some(d => d.toLowerCase().includes('vlucht') || d.toLowerCase().includes('vliegen') || d.toLowerCase().includes('vliegtuig'))) return true;
  return false;
}

function toggleFaseCollapse(faseKey) {
  const key = "collapsed_fase_" + faseKey;
  const current = ls_get(key, false);
  ls_set(key, !current);
  renderTimeline();
}

function scrollToFase(faseKey) {
  // Ensure the phase is expanded so it is visible
  ls_set("collapsed_fase_" + faseKey, false);
  renderTimeline();
  
  // Wait for rendering to complete, then scroll
  setTimeout(() => {
    const el = document.getElementById("fase-" + faseKey);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, 50);
}

function renderTimeline(){
  const el = document.getElementById("timeline");
  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];

  let html = "";
  let lastFase = null;
  const sortedTrips = [...TRIP].sort((a, b) => a.start.localeCompare(b.start));
  for (const item of sortedTrips) {
    if (!tripIds.includes(item.id)) continue;
    if (item.fase !== lastFase) {
      if (lastFase !== null) {
        html += `</div>`; // Close previous phase items container
      }
      const f = FASES[item.fase];
      const isCollapsed = ls_get("collapsed_fase_" + item.fase, false);
      const stats = getPhaseStats(item.fase, tripIds);
      let statsHtml = "";
      if (stats) {
        statsHtml = `
        <div class="fase-stats">
          <span class="fase-days">📅 ${stats.days} ${stats.days === 1 ? 'dag' : 'dagen'}</span>
          <span class="fase-dates">(${stats.dateRange})</span>
          ${stats.totalCost ? `<span class="fase-cost">💰 €${stats.totalCost}</span>` : ""}
        </div>
        `;
      }
      
      html += `
      <div class="fase-header collapsible ${isCollapsed ? 'collapsed' : ''}" id="fase-${item.fase}" onclick="toggleFaseCollapse('${item.fase}')" style="--phase-color: ${f.color}">
        <div class="fase-title-group">
          <span class="dot" style="color:${f.color}; background:${f.color}"></span>
          <span class="fase-name">${f.label}</span>
        </div>
        ${statsHtml}
        <span class="fase-chevron">▼</span>
      </div>
      <div class="fase-items-container" id="fase-container-${item.fase}" style="display: ${isCollapsed ? 'none' : 'block'}">
      `;
      lastFase = item.fase;
    }
    const st = statusOf(item);
    const note = ls_get("note_"+item.id, "");
    const nDays = Math.round((dateOf(item.end) - dateOf(item.start)) / 86400000) + 1;
    const durStr = nDays > 1 ? `<span class="dur">${nDays} dagen</span>` : "";
    const dayRange = getTripDayRange(item.start, item.end);
    
    const parsed = parseDetails(item.details);
    const compactBadgesHtml = getCompactBadgesHtml(item, parsed);

    // Collapsible daily details (structured)
    let detailsHtml = "";
    if (item.details.length) {
      const stayUrl = getAccommodationUrl(item);
      
      let transportHtml = parsed.transport.length ? `
        <div class="card-section transport-section">
          <div class="section-title">✈️ Vervoer &amp; Reisdetails</div>
          <ul class="transport-list">
            ${parsed.transport.map(t => `<li>${t}</li>`).join("")}
          </ul>
        </div>
      ` : "";

      let stayHtml = (parsed.stay.length || stayUrl) ? `
        <div class="card-section stay-section">
          <div class="section-title">
            🏨 Verblijf &amp; Accommodatie
            ${stayUrl ? `<a href="${stayUrl}" target="_blank" rel="noopener" class="airbnb-btn-link">🏠 Bekijk Airbnb →</a>` : ""}
          </div>
          ${parsed.stay.length ? `
          <ul class="stay-list">
            ${parsed.stay.map(s => `<li>${s}</li>`).join("")}
          </ul>` : ""}
        </div>
      ` : "";

      let activitiesHtml = parsed.activities.length ? `
        <div class="card-section program-section">
          <div class="section-title">🥾 Activiteiten &amp; Programma</div>
          <ul class="program-list">
            ${parsed.activities.map(a => `<li>${a}</li>`).join("")}
          </ul>
        </div>
      ` : "";

      let tipsHtml = parsed.tips.length ? `
        <div class="tips-box">
          <div class="tips-box-title">💡 Handige Tips &amp; Info</div>
          <ul class="tips-list">
            ${parsed.tips.map(t => `<li>${t}</li>`).join("")}
          </ul>
        </div>
      ` : "";

      detailsHtml = `
      <div class="details-content">
        ${transportHtml}
        ${stayHtml}
        ${activitiesHtml}
        ${tipsHtml}
      </div>
      `;
    }

    const f = FASES[item.fase];

    html += `
    <div class="timeline-item" id="${item.id}">
      <div class="when" style="--phase-color: ${f.color}">
        <span class="day-number">${dayRange}</span>
        <span class="date-range">${fmtRange(item.start,item.end)}</span>
        ${durStr}
      </div>
      <div class="timeline-node" style="--phase-color: ${f.color}"></div>
      <div class="item-card">
        <div class="item-head">
          <div class="item-title-wrapper">
            <h3>${item.title}</h3>
            ${compactBadgesHtml}
          </div>
          <span class="badge ${st}">${STATUS_LABEL[st]}</span>
        </div>
        ${detailsHtml}
        ${photoStripHtml(item)}
        ${item.costs.length ? `<div class="costs">${item.costs.map(cid => costLineHtml(cid)).join("")}</div>` : ""}
      </div>
    </div>`;
  }
  
  if (lastFase !== null) {
    html += `</div>`; // Close the last phase container
  }
  
  el.innerHTML = html;

  // Add event listeners to input fields
  el.querySelectorAll("input.cost-input").forEach(inp => {
    inp.addEventListener("input", () => { ls_set("cost_"+inp.dataset.cost, inp.value); });
  });
  el.querySelectorAll("input.booked-cb").forEach(cb => {
    cb.addEventListener("change", () => { ls_set("booked_"+cb.dataset.cost, cb.checked); });
  });

  // Keep view mode state
  updateViewModeUI();
}

    const avatarHtml = photo 
      ? `<img src="${photo}" alt="">` 
      : `<span class="avatar-initials" style="color:${p.color}">${p.name.substring(0, 2)}</span>`;

    return `
      <button class="person-card ${isActive ? 'active' : ''}" onclick="selectPerson('${key}')">
        <div class="person-card-avatar" style="border-color:${p.color}">
          ${avatarHtml}
        </div>
        <span class="person-card-name">${p.name}</span>
      </button>
    `;
  }).join("");
  html += `</div>`;
  
  container.innerHTML = html;
}

function togglePersonSelector() {
  const isCollapsed = ls_get("person_selector_collapsed", false);
  ls_set("person_selector_collapsed", !isCollapsed);
  renderPersonSelector();
}

function selectPerson(key) {
  ls_set("selected_person", key);
  renderPersonSelector();
  renderPhaseNav();
  renderTimeline();
}

/* ── VIEW MODE & EXPANSION CONTROL ── */
function setViewMode(mode) {
  ls_set("timeline_view_mode", mode);
  updateViewModeUI();
}

function updateViewModeUI() {
  const mode = ls_get("timeline_view_mode", "expanded");
  const container = document.getElementById("timeline");
  if (!container) return;
  
  if (mode === "compact") {
    container.classList.add("compact");
    document.getElementById("viewCompactBtn")?.classList.add("active");
    document.getElementById("viewExpandedBtn")?.classList.remove("active");
  } else {
    container.classList.remove("compact");
    document.getElementById("viewCompactBtn")?.classList.remove("active");
    document.getElementById("viewExpandedBtn")?.classList.add("active");
  }
}

function toggleAllDetails(open) {
  ls_set("details_expanded_default", open);
  
  const personKey = ls_get("selected_person", "matthew");
  const tripIds = PERSON_TRIPS[personKey] || [];
  const activeFases = new Set(TRIP.filter(i => tripIds.includes(i.id)).map(i => i.fase));
  
  activeFases.forEach(faseKey => {
    ls_set("collapsed_fase_" + faseKey, !open);
  });
  
  renderTimeline();
}

/* ---------------- INIT ---------------- */
function init() {
  renderPersonSelector();
  renderPhaseNav();
  renderTimeline();
  updateViewModeUI();
  
  if (window.location.hash) {
    setTimeout(() => {
      const el = document.querySelector(window.location.hash);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
